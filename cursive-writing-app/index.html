<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Writing Practice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-pink { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-gray { background: #eee; color: #333; }

        .copybook {
            background: #fffef8;
            border: 2px solid #ddd;
            border-radius: 10px;
            min-height: 280px;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .writing-canvas {
            width: 100%;
            height: 260px;
            display: block;
        }

        .copybook-labels {
            position: absolute;
            right: 8px;
            top: 0;
            font-size: 9px;
            color: #999;
            pointer-events: none;
            z-index: 10;
        }

        .copybook-labels span {
            position: absolute;
            right: 0;
            white-space: nowrap;
        }

        .label-top { top: 45px; }
        .label-mid { top: 95px; color: #ff6666; }
        .label-base { top: 145px; color: #4444ff; }
        .label-desc { top: 195px; color: #999; }

        .progress-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .progress-dot.done { background: #4caf50; color: white; }
        .progress-dot.current {
            background: #667eea;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(102,126,234,0.5);
        }

        .instruction-box {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #ffc107;
            margin-top: 15px;
        }

        .instruction-box h3 {
            color: #f57f17;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-letter-display {
            font-size: 2em;
            color: #667eea;
        }

        .instruction-text {
            color: #5d4037;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel h3 {
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1em;
        }

        .setting-row {
            margin-bottom: 12px;
        }

        .setting-row label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.9em;
        }

        .setting-row select, .setting-row input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .letter-btn {
            padding: 6px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 1.1em;
        }

        .letter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #f0f4ff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .word-chip:hover {
            background: #667eea;
            color: white;
        }

        .speed-label {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stroke-guide {
            background: #f0f8ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .stroke-guide h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .stroke-steps {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stroke-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
        }

        .step-num {
            width: 20px;
            height: 20px;
            background: #1976d2;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Cursive Writing Practice</h1>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="input-row">
                    <input type="text" id="wordInput" placeholder="Type a word..." value="hello">
                    <button class="btn btn-primary" onclick="startWriting()">Write It!</button>
                    <button class="btn btn-pink" onclick="startWriting()">🔄 Repeat</button>
                </div>

                <div class="progress-row" id="progressRow"></div>

                <div class="copybook">
                    <div class="copybook-labels">
                        <span class="label-top">Top line</span>
                        <span class="label-mid">Midline</span>
                        <span class="label-base">Baseline</span>
                        <span class="label-desc">Descender</span>
                    </div>
                    <canvas class="writing-canvas" id="writingCanvas"></canvas>
                </div>

                <div class="instruction-box">
                    <h3>💡 How to Write: <span class="current-letter-display" id="currentLetter">h</span></h3>
                    <div class="instruction-text" id="instructionText">
                        Type a word and click "Write It!" to begin.
                    </div>
                    <div class="stroke-guide" id="strokeGuide">
                        <h4>Stroke Order:</h4>
                        <div class="stroke-steps" id="strokeSteps"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-gray" onclick="prevLetter()">⬅️ Prev</button>
                    <button class="btn btn-gray" onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
                    <button class="btn btn-gray" onclick="nextLetter()">Next ➡️</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="card panel">
                    <h3>⚙️ Settings</h3>

                    <div class="setting-row">
                        <label>Letter Case</label>
                        <select id="caseSelect" onchange="startWriting()">
                            <option value="lower">All Lowercase</option>
                            <option value="upper">All Uppercase</option>
                            <option value="mixed">As Typed</option>
                            <option value="title">Title Case</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="10" value="5" onchange="updateSpeedLabel()">
                        <div class="speed-label" id="speedLabel">Medium</div>
                    </div>

                    <div class="setting-row">
                        <label>Pen Size</label>
                        <select id="sizeSelect" onchange="startWriting()">
                            <option value="2">Fine</option>
                            <option value="3" selected>Medium</option>
                            <option value="5">Bold</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Ink Color</label>
                        <select id="colorSelect" onchange="startWriting()">
                            <option value="#1a237e">Navy Blue</option>
                            <option value="#333333">Black</option>
                            <option value="#4a148c">Purple</option>
                            <option value="#b71c1c">Red</option>
                            <option value="#1b5e20">Green</option>
                        </select>
                    </div>
                </div>

                <div class="card panel">
                    <h3>🔤 Letters</h3>
                    <div class="letter-grid" id="letterGrid"></div>
                </div>

                <div class="card panel">
                    <h3>📚 Words</h3>
                    <div class="word-chips">
                        <span class="word-chip" onclick="setWord('cat')">cat</span>
                        <span class="word-chip" onclick="setWord('dog')">dog</span>
                        <span class="word-chip" onclick="setWord('hello')">hello</span>
                        <span class="word-chip" onclick="setWord('world')">world</span>
                        <span class="word-chip" onclick="setWord('apple')">apple</span>
                        <span class="word-chip" onclick="setWord('happy')">happy</span>
                        <span class="word-chip" onclick="setWord('love')">love</span>
                        <span class="word-chip" onclick="setWord('school')">school</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Advanced Cursive Stroke Engine
        // Uses Catmull-Rom splines for smooth curves and pressure simulation

        // Each letter defined with control points that will be interpolated
        // Format: { points: [[x,y,pressure], ...], instructions: {...} }
        // Coordinates: 0-100 units, baseline=70, midline=40, top=10, descender=95

        const cursiveLetters = {
            'a': {
                width: 45,
                strokes: [
                    // Entry up, oval, down, exit - all connected
                    [[0,70,0.3], [8,50,0.7], [15,38,0.9], [10,32,0.8], [5,38,0.7], [5,52,0.8], [12,62,0.9], [25,65,0.9], [35,58,0.8], [38,45,0.7], [35,35,0.6], [25,32,0.5], [15,38,0.6]],
                    [[38,45,0.8], [38,68,0.9], [45,62,0.5]]
                ],
                instructions: { steps: ['Upstroke to midline', 'Oval counter-clockwise', 'Down and exit'], tip: 'Make a smooth oval, connect to the exit stroke.' }
            },
            'b': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [5,45,0.7], [10,20,0.9], [15,12,0.7], [20,15,0.5], [18,25,0.6], [12,38,0.8], [12,70,0.9]],
                    [[12,70,0.5], [12,52,0.7], [22,45,0.9], [35,50,0.9], [40,62,0.8], [38,70,0.7], [45,65,0.4]]
                ],
                instructions: { steps: ['Tall loop up', 'Down to baseline', 'Bump right'], tip: 'Start with a tall loop, bump sits on baseline.' }
            },
            'c': {
                width: 40,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,40,0.9], [28,35,0.8], [35,42,0.5]],
                    [[28,35,0.6], [15,38,0.8], [8,50,0.9], [8,62,0.9], [18,72,0.8], [32,68,0.6], [40,58,0.4]]
                ],
                instructions: { steps: ['Upstroke', 'Curve around', 'Exit right'], tip: 'Open curve like a crescent moon.' }
            },
            'd': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,42,0.9], [8,48,0.8], [8,60,0.9], [18,70,0.9], [32,65,0.8], [38,52,0.7], [38,38,0.6]],
                    [[38,38,0.5], [38,15,0.8], [38,70,0.9], [45,65,0.4]]
                ],
                instructions: { steps: ['Oval first', 'Tall stroke up', 'Down and exit'], tip: 'Make the round part, then go tall.' }
            },
            'e': {
                width: 38,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,45,0.9], [20,42,0.7], [22,48,0.5], [18,52,0.6], [12,55,0.8], [8,62,0.9], [15,72,0.8], [28,68,0.6], [38,55,0.4]]
                ],
                instructions: { steps: ['Upstroke', 'Small loop', 'Around and exit'], tip: 'Tiny loop in the middle like an eye.' }
            },
            'f': {
                width: 38,
                strokes: [
                    [[8,25,0.4], [15,15,0.7], [25,12,0.8], [30,20,0.5]],
                    [[22,12,0.6], [18,35,0.9], [15,70,0.9], [12,85,0.8], [5,95,0.5], [0,92,0.3]],
                    [[5,45,0.5], [32,45,0.7], [35,45,0.4]]
                ],
                instructions: { steps: ['Top curve', 'Long stroke down', 'Cross at midline'], tip: 'Goes above and below the lines!' }
            },
            'g': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,42,0.9], [8,48,0.8], [8,60,0.9], [18,70,0.9], [32,65,0.8], [38,52,0.7], [38,42,0.6]],
                    [[38,42,0.7], [38,80,0.9], [32,95,0.8], [18,95,0.6], [8,88,0.4]]
                ],
                instructions: { steps: ['Oval shape', 'Down below baseline', 'Curve left'], tip: 'Like "a" with a tail going down.' }
            },
            'h': {
                width: 48,
                strokes: [
                    [[0,70,0.3], [5,45,0.7], [10,18,0.9], [16,12,0.7], [20,18,0.5], [16,30,0.7], [12,50,0.9], [12,70,0.9]],
                    [[12,70,0.5], [12,50,0.7], [20,42,0.9], [32,40,0.9], [42,48,0.8], [45,65,0.9], [48,60,0.4]]
                ],
                instructions: { steps: ['Tall loop', 'Down', 'Hump right'], tip: 'Like "n" attached to a tall stem.' }
            },
            'i': {
                width: 28,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,70,0.9], [22,65,0.6], [28,58,0.3]],
                    [[15,25,0.5], [16,27,0.7], [17,25,0.5]]
                ],
                instructions: { steps: ['Upstroke', 'Down', 'Dot'], tip: 'Simple stroke. Don\'t forget the dot!' }
            },
            'j': {
                width: 28,
                strokes: [
                    [[5,70,0.3], [12,52,0.7], [18,40,0.9], [18,75,0.9], [15,90,0.8], [5,95,0.5], [0,90,0.3]],
                    [[18,25,0.5], [19,27,0.7], [20,25,0.5]]
                ],
                instructions: { steps: ['Upstroke', 'Down and curve', 'Dot'], tip: 'Like "i" with a descending tail.' }
            },
            'k': {
                width: 42,
                strokes: [
                    [[0,70,0.3], [5,45,0.7], [10,18,0.9], [16,12,0.7], [20,18,0.5], [16,35,0.8], [12,55,0.9], [12,70,0.9]],
                    [[35,35,0.4], [25,48,0.7], [18,55,0.8]],
                    [[18,55,0.7], [28,65,0.9], [38,72,0.7], [42,68,0.4]]
                ],
                instructions: { steps: ['Tall loop down', 'Kick in', 'Kick out'], tip: 'Kicks meet in the middle.' }
            },
            'l': {
                width: 32,
                strokes: [
                    [[0,70,0.3], [5,45,0.7], [10,18,0.9], [18,12,0.7], [22,18,0.5], [18,32,0.7], [14,55,0.9], [14,70,0.9], [22,65,0.6], [32,55,0.3]]
                ],
                instructions: { steps: ['Tall loop', 'Down', 'Exit'], tip: 'Elegant tall loop with smooth exit.' }
            },
            'm': {
                width: 60,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,70,0.9], [15,52,0.7], [22,42,0.9], [32,42,0.9], [38,52,0.8], [38,70,0.9], [38,52,0.7], [45,42,0.9], [55,42,0.9], [58,55,0.8], [58,70,0.9], [60,65,0.4]]
                ],
                instructions: { steps: ['Up', 'First hump', 'Second hump', 'Exit'], tip: 'Two even humps side by side.' }
            },
            'n': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,70,0.9], [15,52,0.7], [22,42,0.9], [35,42,0.9], [42,55,0.8], [42,70,0.9], [45,65,0.4]]
                ],
                instructions: { steps: ['Up', 'Down', 'Hump', 'Exit'], tip: 'One smooth hill - half of "m".' }
            },
            'o': {
                width: 42,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,45,0.9], [8,52,0.8], [8,62,0.9], [18,72,0.9], [32,68,0.8], [38,55,0.7], [38,45,0.6], [30,38,0.5], [18,40,0.6], [15,48,0.7]],
                    [[38,55,0.5], [42,62,0.3]]
                ],
                instructions: { steps: ['Oval', 'Close', 'Exit'], tip: 'Round oval with connector.' }
            },
            'p': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,95,0.9]],
                    [[15,95,0.5], [15,70,0.7], [15,52,0.8], [25,45,0.9], [38,50,0.9], [42,62,0.8], [38,72,0.6], [25,72,0.5], [15,65,0.4]],
                    [[42,62,0.4], [45,58,0.3]]
                ],
                instructions: { steps: ['Down below baseline', 'Up', 'Bump', 'Exit'], tip: 'Stem goes below, bump on top.' }
            },
            'q': {
                width: 48,
                strokes: [
                    [[0,70,0.3], [8,55,0.7], [15,45,0.9], [8,52,0.8], [8,62,0.9], [18,72,0.9], [32,68,0.8], [38,55,0.7], [38,45,0.6], [30,38,0.5], [18,40,0.6]],
                    [[38,45,0.7], [38,88,0.9], [42,95,0.7], [50,95,0.4]]
                ],
                instructions: { steps: ['Oval', 'Down below', 'Tail right'], tip: 'Tail goes right - opposite of "g"!' }
            },
            'r': {
                width: 32,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,70,0.9]],

            },
            's': {
                width: 35,
                strokes: [
                    [[0,70,0.3], [8,58,0.7], [15,48,0.9], [25,42,0.8], [30,48,0.6], [28,55,0.7], [20,60,0.8], [12,65,0.9], [10,72,0.8], [18,78,0.6], [28,72,0.5], [35,62,0.3]]

                instructions: { steps: ['Up', 'Curve', 'Snake', 'Exit'], tip: 'S-curve like a snake!' }

                    [[0,70,0.3], [8,52,0.7], [15,30,0.9], [15,70,0.9], [22,65,0.6], [30,58,0.3]],

                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,65,0.9], [22,75,0.8], [32,75,0.8], [40,65,0.7], [42,50,0.6], [42,40,0.5]],
                    [[42,40,0.6], [42,70,0.9], [45,65,0.4]]

            'v': {

                ],
                instructions: { steps: ['Up', 'Down diagonal', 'Up diagonal'], tip: 'Sharp point at bottom.' }
            },
            'w': {
                width: 55,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [12,40,0.9], [20,72,0.9], [28,48,0.8], [38,72,0.9], [45,48,0.7], [52,58,0.5], [55,55,0.3]]
                ],
                instructions: { steps: ['Up', 'V', 'V', 'Exit'], tip: 'Two connected V shapes.' }
            },
            'x': {
                width: 38,
                strokes: [
                    [[0,70,0.3], [8,58,0.7], [15,48,0.9], [28,72,0.8], [35,68,0.4]],
                    [[32,42,0.4], [22,55,0.8], [12,68,0.7], [5,75,0.3]]
                ],
                instructions: { steps: ['First diagonal', 'Second diagonal'], tip: 'Strokes cross in center.' }
            },
            'y': {
                width: 45,
                strokes: [
                    [[0,70,0.3], [8,52,0.7], [15,40,0.9], [15,65,0.9], [22,75,0.8], [32,75,0.8], [40,65,0.7], [42,50,0.6], [42,40,0.5]],
                    [[42,40,0.6], [42,85,0.9], [35,95,0.7], [22,95,0.5], [12,88,0.3]]
                ],
                instructions: { steps: ['U-shape', 'Down below', 'Curve left'], tip: 'Like "u" with descending tail.' }
            },
            'z': {
                width: 38,
                strokes: [
                    [[0,70,0.3], [8,58,0.6], [12,45,0.8], [32,45,0.9], [12,72,0.9], [35,72,0.8], [38,68,0.4]]
                ],
                instructions: { steps: ['Up', 'Across', 'Diagonal', 'Across', 'Exit'], tip: 'Zigzag pattern!' }
            },
            ' ': {
                width: 25,
                strokes: [],
                instructions: { steps: ['Lift pen', 'Move right'], tip: 'Space between words.' }
            }
        };

        const defaultInstruction = { steps: ['Follow shape'], tip: 'Watch and follow!' };

        // State
        let canvas, ctx;
        let currentWord = '', displayWord = '';
        let currentIndex = 0;
        let isAnimating = false, isPaused = false;
        let animationId = null;
        let allLetterData = [];
        let drawnSegments = [];

        // Catmull-Rom spline interpolation for smooth curves
        function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            return {
                x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x) * t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x) * t3),
                y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y) * t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y) * t3),
                p: p1.p + (p2.p - p1.p) * t // Linear interpolate pressure
            };
        }

        // Generate smooth curve points from control points
        function generateSmoothPoints(controlPoints, resolution = 8) {
            if (controlPoints.length < 2) return controlPoints.map(p => ({x: p[0], y: p[1], p: p[2] || 0.7}));

            const points = [];
            const pts = controlPoints.map(p => ({x: p[0], y: p[1], p: p[2] || 0.7}));

            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[Math.max(0, i - 1)];
                const p1 = pts[i];
                const p2 = pts[Math.min(pts.length - 1, i + 1)];
                const p3 = pts[Math.min(pts.length - 1, i + 2)];

                for (let t = 0; t < 1; t += 1/resolution) {
                    points.push(catmullRom(p0, p1, p2, p3, t));
                }
            }
            points.push(pts[pts.length - 1]);
            return points;
        }

        function init() {
            canvas = document.getElementById('writingCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            buildLetterGrid();
            updateSpeedLabel();
            startWriting();
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 260;
            drawCopybookLines();
            redrawAll();
        }

        function drawCopybookLines() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Top line
            ctx.strokeStyle = '#ffcccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(canvas.width, 50);
            ctx.stroke();

            // Midline (dashed)
            ctx.strokeStyle = '#ff9999';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 100);
            ctx.lineTo(canvas.width, 100);
            ctx.stroke();
            ctx.setLineDash([]);

            // Baseline
            ctx.strokeStyle = '#4444ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 150);
            ctx.lineTo(canvas.width, 150);
            ctx.stroke();

            // Descender
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 200);
            ctx.lineTo(canvas.width, 200);
            ctx.stroke();
        }

        function buildLetterGrid() {
            const grid = document.getElementById('letterGrid');
            'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => setWord(letter);
                grid.appendChild(btn);
            });
        }

        function setWord(word) {
            document.getElementById('wordInput').value = word;
            startWriting();
        }

        function applyCase(text) {
            const opt = document.getElementById('caseSelect').value;
            if (opt === 'lower') return text.toLowerCase();
            if (opt === 'upper') return text.toUpperCase();
            if (opt === 'title') return text.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
            return text;
        }

        function startWriting() {
            cancelAnimation();

            currentWord = document.getElementById('wordInput').value.trim();
            if (!currentWord) return;

            displayWord = applyCase(currentWord).toLowerCase();
            currentIndex = 0;
            isAnimating = true;
            isPaused = false;
            drawnSegments = [];
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            // Build progress
            const progressRow = document.getElementById('progressRow');
            progressRow.innerHTML = '';
            displayWord.split('').forEach((char, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.textContent = char;
                dot.onclick = () => jumpTo(i);
                progressRow.appendChild(dot);
            });

            buildAllLetterData();
            drawCopybookLines();
            updateProgress();
            showInstruction(0);
            animateWriting();
        }

        function buildAllLetterData() {
            allLetterData = [];
            let xOffset = 40;
            const scale = 1.8;

            for (let i = 0; i < displayWord.length; i++) {
                const char = displayWord[i];
                const letterDef = cursiveLetters[char] || cursiveLetters['a'];

                // Generate smooth points for each stroke
                const smoothStrokes = letterDef.strokes.map(stroke => {
                    const scaledPoints = stroke.map(p => [
                        xOffset + p[0] * scale,
                        p[1] * scale + 10,
                        p[2] || 0.7
                    ]);
                    return generateSmoothPoints(scaledPoints, 6);
                });

                allLetterData.push({
                    char,
                    strokes: smoothStrokes,
                    charIndex: i
                });

                xOffset += (letterDef.width || 40) * scale + 8;
            }
        }

        function updateProgress() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentIndex) dot.classList.add('done');
                else if (i === currentIndex) dot.classList.add('current');
            });
        }

        function showInstruction(index) {
            const letterSpan = document.getElementById('currentLetter');
            const textDiv = document.getElementById('instructionText');
            const stepsDiv = document.getElementById('strokeSteps');

            if (index >= displayWord.length) {
                letterSpan.textContent = '✓';
                textDiv.innerHTML = '<strong>Great job!</strong> You completed the word!';
                stepsDiv.innerHTML = '';
                return;
            }

            const char = displayWord[index];
            letterSpan.textContent = char;

            const letterDef = cursiveLetters[char];
            const info = letterDef ? letterDef.instructions : defaultInstruction;
            textDiv.innerHTML = `<strong>Tip:</strong> ${info.tip}`;
            stepsDiv.innerHTML = info.steps.map((step, i) =>
                `<div class="stroke-step"><span class="step-num">${i+1}</span>${step}</div>`
            ).join('');
        }

        // Draw a segment with pressure-sensitive width
        function drawSegment(from, to, color, baseSize) {
            const avgPressure = (from.p + to.p) / 2;
            const width = baseSize * (0.5 + avgPressure);

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();

            // Store for redraw
            drawnSegments.push({ from: {...from}, to: {...to}, color, baseSize });
        }

        function animateWriting() {
            if (!isAnimating || isPaused) return;
            if (currentIndex >= allLetterData.length) {
                isAnimating = false;
                return;
            }

            const letterData = allLetterData[currentIndex];
            const color = document.getElementById('colorSelect').value;
            const baseSize = parseInt(document.getElementById('sizeSelect').value);
            const speed = parseInt(document.getElementById('speedSlider').value);
            const delay = Math.max(5, (11 - speed) * 8);

            let strokeIdx = 0;
            let pointIdx = 0;

            function drawNext() {
                if (!isAnimating || isPaused) return;

                if (strokeIdx >= letterData.strokes.length) {
                    currentIndex++;
                    updateProgress();
                    showInstruction(currentIndex);

                    if (currentIndex < allLetterData.length) {
                        animationId = setTimeout(animateWriting, 150);
                    } else {
                        isAnimating = false;
                    }
                    return;
                }

                const stroke = letterData.strokes[strokeIdx];

                if (stroke.length === 0) {
                    strokeIdx++;
                    animationId = setTimeout(drawNext, delay);
                    return;
                }

                if (pointIdx < stroke.length - 1) {
                    drawSegment(stroke[pointIdx], stroke[pointIdx + 1], color, baseSize);
                    pointIdx++;
                    animationId = setTimeout(drawNext, delay);
                } else {
                    strokeIdx++;
                    pointIdx = 0;
                    animationId = setTimeout(drawNext, delay * 3);
                }
            }

            drawNext();
        }

        function redrawAll() {
            if (drawnSegments.length === 0) return;

            for (const seg of drawnSegments) {
                const avgPressure = (seg.from.p + seg.to.p) / 2;
                const width = seg.baseSize * (0.5 + avgPressure);

                ctx.strokeStyle = seg.color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(seg.from.x, seg.from.y);
                ctx.lineTo(seg.to.x, seg.to.y);
                ctx.stroke();
            }
        }

        function cancelAnimation() {
            if (animationId) {
                clearTimeout(animationId);
                animationId = null;
            }
            isAnimating = false;
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                btn.textContent = '⏸️ Pause';
                animateWriting();
            } else {
                isPaused = true;
                btn.textContent = '▶️ Resume';
            }
        }

        function drawLetterInstantly(letterIdx) {
            if (letterIdx >= allLetterData.length) return;

            const letterData = allLetterData[letterIdx];
            const color = document.getElementById('colorSelect').value;
            const baseSize = parseInt(document.getElementById('sizeSelect').value);

            for (const stroke of letterData.strokes) {
                for (let i = 0; i < stroke.length - 1; i++) {
                    drawSegment(stroke[i], stroke[i + 1], color, baseSize);
                }
            }
        }

        function rebuildToIndex(targetIndex) {
            drawnSegments = [];
            drawCopybookLines();

            for (let i = 0; i < targetIndex && i < allLetterData.length; i++) {
                drawLetterInstantly(i);
            }
        }

        function prevLetter() {
            if (currentIndex > 0) {
                cancelAnimation();
                currentIndex--;
                rebuildToIndex(currentIndex);
                updateProgress();
                showInstruction(currentIndex);
                isAnimating = true;
                isPaused = false;
                animateWriting();
            }
        }

        function nextLetter() {
            if (currentIndex < displayWord.length) {
                cancelAnimation();
                drawLetterInstantly(currentIndex);
                currentIndex++;
                updateProgress();
                showInstruction(currentIndex);

                if (currentIndex < displayWord.length) {
                    isAnimating = true;
                    isPaused = false;
                    animateWriting();
                }
            }
        }

        function jumpTo(index) {
            cancelAnimation();
            rebuildToIndex(index);
            currentIndex = index;
            updateProgress();
            showInstruction(currentIndex);
            isAnimating = true;
            isPaused = false;
            animateWriting();
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speedSlider').value;
            const labels = ['', 'Very Slow', 'Slow', 'Slow', 'Medium-Slow', 'Medium', 'Medium', 'Medium-Fast', 'Fast', 'Fast', 'Very Fast'];
            document.getElementById('speedLabel').textContent = labels[val];
        }

        window.onload = init;
    </script>
</body>
</html>
