<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Writing Practice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-pink { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-gray { background: #eee; color: #333; }

        .copybook {
            background: #fffef8;
            border: 2px solid #ddd;
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .copybook-labels {
            position: absolute;
            right: 8px;
            top: 0;
            font-size: 9px;
            color: #999;
            pointer-events: none;
            z-index: 10;
        }

        .copybook-labels span {
            position: absolute;
            right: 0;
            white-space: nowrap;
        }

        .label-top { top: 70px; }
        .label-mid { top: 130px; color: #ff6666; }
        .label-base { top: 200px; color: #4444ff; }
        .label-desc { top: 260px; color: #999; }

        .writing-area {
            padding: 20px 30px;
            position: relative;
        }

        #writingSvg {
            width: 100%;
            height: 280px;
            overflow: visible;
        }

        .guideline { fill: none; }
        .guideline-top { stroke: #ffcccc; stroke-width: 1; }
        .guideline-mid { stroke: #ff9999; stroke-width: 1; stroke-dasharray: 5,5; }
        .guideline-base { stroke: #4444ff; stroke-width: 2; }
        .guideline-desc { stroke: #cccccc; stroke-width: 1; }

        .letter-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .letter-guide {
            stroke: #e8e8e8;
            stroke-width: 4;
        }

        .letter-draw {
            stroke-width: 3;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
        }

        .progress-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.2s;
            font-style: italic;
        }

        .progress-dot.done { background: #4caf50; color: white; }
        .progress-dot.current {
            background: #667eea;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(102,126,234,0.5);
        }

        .instruction-box {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #ffc107;
            margin-top: 15px;
        }

        .instruction-box h3 {
            color: #f57f17;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-letter-display {
            font-size: 2.5em;
            font-style: italic;
            color: #667eea;
        }

        .instruction-text {
            color: #5d4037;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel h3 {
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1em;
        }

        .setting-row {
            margin-bottom: 12px;
        }

        .setting-row label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.9em;
        }

        .setting-row select, .setting-row input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .letter-btn {
            padding: 8px 4px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 1.3em;
            font-style: italic;
        }

        .letter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #f0f4ff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.95em;
            font-style: italic;
        }

        .word-chip:hover {
            background: #667eea;
            color: white;
        }

        .speed-label {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stroke-guide {
            background: #f0f8ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .stroke-guide h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Cursive Writing Practice</h1>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="input-row">
                    <input type="text" id="wordInput" placeholder="Type a word..." value="hello">
                    <button class="btn btn-primary" onclick="startWriting()">Write It!</button>
                    <button class="btn btn-pink" onclick="startWriting()">🔄 Repeat</button>
                </div>

                <div class="progress-row" id="progressRow"></div>

                <div class="copybook">
                    <div class="copybook-labels">
                        <span class="label-top">Top line</span>
                        <span class="label-mid">Midline</span>
                        <span class="label-base">Baseline</span>
                        <span class="label-desc">Descender</span>
                    </div>
                    <div class="writing-area">
                        <svg id="writingSvg" viewBox="0 0 700 280">
                            <line x1="0" y1="75" x2="700" y2="75" class="guideline guideline-top"/>
                            <line x1="0" y1="135" x2="700" y2="135" class="guideline guideline-mid"/>
                            <line x1="0" y1="205" x2="700" y2="205" class="guideline guideline-base"/>
                            <line x1="0" y1="265" x2="700" y2="265" class="guideline guideline-desc"/>
                            <g id="lettersGroup"></g>
                        </svg>
                    </div>
                </div>

                <div class="instruction-box">
                    <h3>💡 How to Write: <span class="current-letter-display" id="currentLetter">h</span></h3>
                    <div class="instruction-text" id="instructionText">
                        Loading font... Please wait.
                    </div>
                    <div class="stroke-guide" id="strokeGuide">
                        <h4>Watch the stroke being drawn!</h4>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-gray" onclick="prevLetter()">⬅️ Prev</button>
                    <button class="btn btn-gray" onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
                    <button class="btn btn-gray" onclick="nextLetter()">Next ➡️</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="card panel">
                    <h3>⚙️ Settings</h3>

                    <div class="setting-row">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="10" value="5" onchange="updateSpeedLabel()">
                        <div class="speed-label" id="speedLabel">Medium</div>
                    </div>

                    <div class="setting-row">
                        <label>Pen Size</label>
                        <select id="sizeSelect">
                            <option value="2">Fine</option>
                            <option value="3" selected>Medium</option>
                            <option value="4">Bold</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Ink Color</label>
                        <select id="colorSelect">
                            <option value="#1a237e">Navy Blue</option>
                            <option value="#000000">Black</option>
                            <option value="#4a148c">Purple</option>
                            <option value="#b71c1c">Red</option>
                            <option value="#1b5e20">Green</option>
                        </select>
                    </div>
                </div>

                <div class="card panel">
                    <h3>🔤 Letters</h3>
                    <div class="letter-grid" id="letterGrid"></div>
                </div>

                <div class="card panel">
                    <h3>📚 Practice Words</h3>
                    <div class="word-chips">
                        <span class="word-chip" onclick="setWord('cat')">cat</span>
                        <span class="word-chip" onclick="setWord('dog')">dog</span>
                        <span class="word-chip" onclick="setWord('hello')">hello</span>
                        <span class="word-chip" onclick="setWord('love')">love</span>
                        <span class="word-chip" onclick="setWord('happy')">happy</span>
                        <span class="word-chip" onclick="setWord('sun')">sun</span>
                        <span class="word-chip" onclick="setWord('moon')">moon</span>
                        <span class="word-chip" onclick="setWord('star')">star</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OpenType.js for font path extraction -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <script>
        // State
        let font = null;
        let currentWord = '', displayWord = '';
        let currentIndex = 0;
        let isAnimating = false, isPaused = false;
        let animationId = null;
        let letterPaths = [];
        let fontLoaded = false;

        // Letter tips
        const letterTips = {
            'a': 'Start with upstroke, curve around in an oval, then exit with a connector stroke.',
            'b': 'Begin at baseline, stroke up tall, loop at top, come down and make a bump.',
            'c': 'Upstroke to midline, curve around like a crescent moon, exit right.',
            'd': 'Make the oval first, then tall stroke up, down and exit right.',
            'e': 'Upstroke, tiny loop at midline, curve around and exit.',
            'f': 'Start at top with curve, long stroke down below baseline, cross at midline.',
            'g': 'Make oval like "a", continue down below baseline, curve back left.',
            'h': 'Tall stroke up with loop, down, then hump to the right.',
            'i': 'Short upstroke, down to baseline, add dot above.',
            'j': 'Like "i" but continue below baseline with a curve left, add dot.',
            'k': 'Tall stroke with loop, diagonal kick in, diagonal kick out.',
            'l': 'Tall stroke up with elegant loop at top, down and exit right.',
            'm': 'Upstroke, then two humps side by side, exit right.',
            'n': 'Upstroke, one hump over, exit right.',
            'o': 'Upstroke into oval, close it, small exit connector.',
            'p': 'Upstroke, down below baseline, back up, make bump on top half.',
            'q': 'Make oval, down below baseline, tail curves to the right.',
            'r': 'Upstroke, down, small shoulder curve to exit.',
            's': 'Upstroke, snake curve - up, back, down, out.',
            't': 'Upstroke (shorter than l), down, cross at midline.',
            'u': 'Upstroke, down curve, up, down and exit.',
            'v': 'Upstroke, diagonal down to point, diagonal up.',
            'w': 'Upstroke, two connected V shapes, exit.',
            'x': 'First diagonal stroke, cross with second diagonal.',
            'y': 'Like "u" on top, but continue down below baseline, curve left.',
            'z': 'Upstroke, across top, diagonal down, across bottom.'
        };

        // Initialize
        async function init() {
            buildLetterGrid();
            updateSpeedLabel();

            // Load a professional cursive font
            try {
                // Using Dancing Script from Google Fonts (converted to direct URL)
                const fontUrl = 'https://fonts.gstatic.com/s/dancingscript/v25/If2cXTr6YS-zF4S-kcSWSVi_sxjsohD9F50Ruu7BMSo3Sup6hNX6plRP.woff';

                font = await opentype.load(fontUrl);
                fontLoaded = true;
                document.getElementById('instructionText').innerHTML = '<strong>Ready!</strong> Type a word and click "Write It!"';
                startWriting();
            } catch (e) {
                console.error('Font loading error:', e);
                // Fallback: try alternative font
                try {
                    const fallbackUrl = 'https://fonts.gstatic.com/s/greatvibes/v18/RWmMoKWR9v4ksMfaWd_JN9XFiaQ.woff';
                    font = await opentype.load(fallbackUrl);
                    fontLoaded = true;
                    document.getElementById('instructionText').innerHTML = '<strong>Ready!</strong> Type a word and click "Write It!"';
                    startWriting();
                } catch (e2) {
                    document.getElementById('instructionText').innerHTML = '<strong>Error:</strong> Could not load font. Please refresh.';
                }
            }
        }

        function buildLetterGrid() {
            const grid = document.getElementById('letterGrid');
            'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => setWord(letter);
                grid.appendChild(btn);
            });
        }

        function setWord(word) {
            document.getElementById('wordInput').value = word;
            startWriting();
        }

        function startWriting() {
            if (!fontLoaded) return;

            cancelAnimation();

            currentWord = document.getElementById('wordInput').value.trim().toLowerCase();
            if (!currentWord) return;

            displayWord = currentWord;
            currentIndex = 0;
            isAnimating = true;
            isPaused = false;
            letterPaths = [];
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            // Build progress dots
            const progressRow = document.getElementById('progressRow');
            progressRow.innerHTML = '';
            displayWord.split('').forEach((char, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.textContent = char;
                dot.onclick = () => jumpTo(i);
                progressRow.appendChild(dot);
            });

            // Generate paths from font
            generatePaths();

            updateProgress();
            showInstruction(0);
            animateLetter();
        }

        function generatePaths() {
            const lettersGroup = document.getElementById('lettersGroup');
            lettersGroup.innerHTML = '';

            const fontSize = 120;
            const baseline = 205;
            let xOffset = 30;

            const color = document.getElementById('colorSelect').value;
            const strokeWidth = document.getElementById('sizeSelect').value;

            displayWord.split('').forEach((char, index) => {
                if (char === ' ') {
                    xOffset += 40;
                    letterPaths.push(null);
                    return;
                }

                // Get glyph path from font
                const glyph = font.charToGlyph(char);
                const path = glyph.getPath(xOffset, baseline, fontSize);
                const pathData = path.toPathData(2);

                if (pathData) {
                    // Create guide path (light gray outline)
                    const guidePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    guidePath.setAttribute('d', pathData);
                    guidePath.setAttribute('class', 'letter-path letter-guide');
                    lettersGroup.appendChild(guidePath);

                    // Create animated stroke path
                    const drawPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    drawPath.setAttribute('d', pathData);
                    drawPath.setAttribute('class', 'letter-path letter-draw');
                    drawPath.setAttribute('stroke', color);
                    drawPath.setAttribute('stroke-width', strokeWidth);
                    lettersGroup.appendChild(drawPath);

                    // Get path length for animation
                    const length = drawPath.getTotalLength();
                    drawPath.style.strokeDasharray = length;
                    drawPath.style.strokeDashoffset = length;

                    letterPaths.push({
                        element: drawPath,
                        length: length,
                        index: index
                    });
                }

                // Advance x position
                const advance = glyph.advanceWidth * (fontSize / font.unitsPerEm);
                xOffset += advance;
            });
        }

        function updateProgress() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentIndex) dot.classList.add('done');
                else if (i === currentIndex) dot.classList.add('current');
            });
        }

        function showInstruction(index) {
            const letterSpan = document.getElementById('currentLetter');
            const textDiv = document.getElementById('instructionText');

            if (index >= displayWord.length) {
                letterSpan.textContent = '✓';
                textDiv.innerHTML = '<strong>Great job!</strong> You completed the word!';
                return;
            }

            const char = displayWord[index];
            letterSpan.textContent = char;
            const tip = letterTips[char] || 'Watch the stroke being drawn and follow along!';
            textDiv.innerHTML = `<strong>Tip:</strong> ${tip}`;
        }

        function animateLetter() {
            if (!isAnimating || isPaused) return;

            // Skip null entries (spaces)
            while (currentIndex < letterPaths.length && letterPaths[currentIndex] === null) {
                currentIndex++;
            }

            if (currentIndex >= letterPaths.length) {
                currentIndex = displayWord.length;
                updateProgress();
                showInstruction(currentIndex);
                isAnimating = false;
                return;
            }

            const pathData = letterPaths[currentIndex];
            const speed = parseInt(document.getElementById('speedSlider').value);
            const duration = (11 - speed) * 400; // ms per letter

            const startTime = performance.now();

            function animate(currentTime) {
                if (!isAnimating || isPaused) return;

                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Smooth easing
                const eased = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                const offset = pathData.length * (1 - eased);
                pathData.element.style.strokeDashoffset = offset;

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    currentIndex++;
                    updateProgress();
                    showInstruction(currentIndex);

                    // Skip spaces
                    while (currentIndex < letterPaths.length && letterPaths[currentIndex] === null) {
                        currentIndex++;
                    }

                    if (currentIndex < letterPaths.length) {
                        setTimeout(() => animateLetter(), 200);
                    } else {
                        isAnimating = false;
                    }
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function cancelAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isAnimating = false;
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                btn.textContent = '⏸️ Pause';
                animateLetter();
            } else {
                isPaused = true;
                btn.textContent = '▶️ Resume';
            }
        }

        function showLettersUpTo(index) {
            letterPaths.forEach((pathData, i) => {
                if (pathData) {
                    if (i < index) {
                        pathData.element.style.strokeDashoffset = 0;
                    } else {
                        pathData.element.style.strokeDashoffset = pathData.length;
                    }
                }
            });
        }

        function prevLetter() {
            if (currentIndex > 0) {
                cancelAnimation();
                currentIndex--;
                // Skip spaces backwards
                while (currentIndex > 0 && letterPaths[currentIndex] === null) {
                    currentIndex--;
                }
                showLettersUpTo(currentIndex);
                updateProgress();
                showInstruction(currentIndex);
                isAnimating = true;
                isPaused = false;
                animateLetter();
            }
        }

        function nextLetter() {
            if (currentIndex < letterPaths.length) {
                cancelAnimation();
                if (letterPaths[currentIndex]) {
                    letterPaths[currentIndex].element.style.strokeDashoffset = 0;
                }
                currentIndex++;
                // Skip spaces
                while (currentIndex < letterPaths.length && letterPaths[currentIndex] === null) {
                    currentIndex++;
                }
                updateProgress();
                showInstruction(currentIndex);

                if (currentIndex < letterPaths.length) {
                    isAnimating = true;
                    isPaused = false;
                    animateLetter();
                }
            }
        }

        function jumpTo(index) {
            cancelAnimation();
            showLettersUpTo(index);
            currentIndex = index;
            // Skip spaces
            while (currentIndex < letterPaths.length && letterPaths[currentIndex] === null) {
                currentIndex++;
            }
            updateProgress();
            showInstruction(currentIndex);

            if (currentIndex < letterPaths.length) {
                isAnimating = true;
                isPaused = false;
                animateLetter();
            }
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speedSlider').value;
            const labels = ['', 'Very Slow', 'Slow', 'Slow', 'Medium-Slow', 'Medium', 'Medium', 'Medium-Fast', 'Fast', 'Fast', 'Very Fast'];
            document.getElementById('speedLabel').textContent = labels[val];
        }

        window.onload = init;
    </script>
</body>
</html>
