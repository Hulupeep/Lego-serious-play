<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Writing Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-pink { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-gray { background: #eee; color: #333; }

        .copybook {
            background: #fffef8;
            border: 2px solid #ddd;
            border-radius: 10px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .copybook-labels {
            position: absolute;
            right: 8px;
            top: 0;
            font-size: 9px;
            color: #999;
            pointer-events: none;
            z-index: 10;
        }

        .copybook-labels span {
            position: absolute;
            right: 0;
            white-space: nowrap;
        }

        .label-top { top: 55px; }
        .label-mid { top: 105px; color: #ff6666; }
        .label-base { top: 175px; color: #4444ff; }
        .label-desc { top: 225px; color: #999; }

        .writing-area {
            padding: 20px 30px;
            position: relative;
        }

        .writing-svg {
            width: 100%;
            height: 250px;
            overflow: visible;
        }

        /* Guidelines */
        .guideline { stroke-width: 1; }
        .guideline-top { stroke: #ffcccc; }
        .guideline-mid { stroke: #ff9999; stroke-dasharray: 5,5; }
        .guideline-base { stroke: #4444ff; stroke-width: 2; }
        .guideline-desc { stroke: #cccccc; }

        /* Letter paths */
        .letter-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .letter-guide {
            stroke: #e0e0e0;
            stroke-width: 2;
        }

        .letter-draw {
            stroke: #1a237e;
            stroke-width: 3;
        }

        .progress-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-family: 'Dancing Script', cursive;
            cursor: pointer;
            transition: all 0.2s;
        }

        .progress-dot.done { background: #4caf50; color: white; }
        .progress-dot.current {
            background: #667eea;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(102,126,234,0.5);
        }

        .instruction-box {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #ffc107;
            margin-top: 15px;
        }

        .instruction-box h3 {
            color: #f57f17;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-letter-display {
            font-size: 2.2em;
            font-family: 'Dancing Script', cursive;
            color: #667eea;
        }

        .instruction-text {
            color: #5d4037;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel h3 {
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1em;
        }

        .setting-row {
            margin-bottom: 12px;
        }

        .setting-row label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.9em;
        }

        .setting-row select, .setting-row input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .letter-btn {
            padding: 8px 4px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 1.3em;
            font-family: 'Dancing Script', cursive;
        }

        .letter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #f0f4ff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Dancing Script', cursive;
        }

        .word-chip:hover {
            background: #667eea;
            color: white;
        }

        .speed-label {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stroke-guide {
            background: #f0f8ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .stroke-guide h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .stroke-steps {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stroke-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
        }

        .step-num {
            width: 20px;
            height: 20px;
            background: #1976d2;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Cursive Writing Practice</h1>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="input-row">
                    <input type="text" id="wordInput" placeholder="Type a word..." value="hello">
                    <button class="btn btn-primary" onclick="startWriting()">Write It!</button>
                    <button class="btn btn-pink" onclick="startWriting()">🔄 Repeat</button>
                </div>

                <div class="progress-row" id="progressRow"></div>

                <div class="copybook">
                    <div class="copybook-labels">
                        <span class="label-top">Top line</span>
                        <span class="label-mid">Midline</span>
                        <span class="label-base">Baseline</span>
                        <span class="label-desc">Descender</span>
                    </div>
                    <div class="writing-area">
                        <svg class="writing-svg" id="writingSvg">
                            <!-- Guidelines drawn by JS -->
                        </svg>
                    </div>
                </div>

                <div class="instruction-box">
                    <h3>💡 How to Write: <span class="current-letter-display" id="currentLetter">h</span></h3>
                    <div class="instruction-text" id="instructionText">
                        Type a word and click "Write It!" to begin.
                    </div>
                    <div class="stroke-guide" id="strokeGuide">
                        <h4>Stroke Order:</h4>
                        <div class="stroke-steps" id="strokeSteps"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-gray" onclick="prevLetter()">⬅️ Prev</button>
                    <button class="btn btn-gray" onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
                    <button class="btn btn-gray" onclick="nextLetter()">Next ➡️</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="card panel">
                    <h3>⚙️ Settings</h3>

                    <div class="setting-row">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="10" value="5" onchange="updateSpeedLabel()">
                        <div class="speed-label" id="speedLabel">Medium</div>
                    </div>

                    <div class="setting-row">
                        <label>Pen Size</label>
                        <select id="sizeSelect">
                            <option value="2">Fine</option>
                            <option value="3" selected>Medium</option>
                            <option value="4">Bold</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Ink Color</label>
                        <select id="colorSelect">
                            <option value="#1a237e">Navy Blue</option>
                            <option value="#000000">Black</option>
                            <option value="#4a148c">Purple</option>
                            <option value="#b71c1c">Red</option>
                            <option value="#1b5e20">Green</option>
                        </select>
                    </div>
                </div>

                <div class="card panel">
                    <h3>🔤 Letters</h3>
                    <div class="letter-grid" id="letterGrid"></div>
                </div>

                <div class="card panel">
                    <h3>📚 Practice Words</h3>
                    <div class="word-chips">
                        <span class="word-chip" onclick="setWord('cat')">cat</span>
                        <span class="word-chip" onclick="setWord('dog')">dog</span>
                        <span class="word-chip" onclick="setWord('hello')">hello</span>
                        <span class="word-chip" onclick="setWord('love')">love</span>
                        <span class="word-chip" onclick="setWord('happy')">happy</span>
                        <span class="word-chip" onclick="setWord('sun')">sun</span>
                        <span class="word-chip" onclick="setWord('moon')">moon</span>
                        <span class="word-chip" onclick="setWord('star')">star</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Hershey Script Simplex - clean stroke-based cursive font
        // Each letter: SVG path data, width, and connection points
        // Coordinates scaled for baseline at y=180, x-height ~60px

        const cursiveLetters = {
            'a': {
                path: 'M 0 120 Q 10 100 25 95 Q 45 90 50 110 Q 55 130 50 150 Q 40 175 25 180 Q 10 180 5 165 Q 0 145 10 125 Q 20 110 35 110 Q 50 115 50 140 L 50 180 Q 55 175 65 170',
                width: 65,
                instructions: { steps: ['Up to midline', 'Curve around', 'Down stroke'], tip: 'Start with upstroke, make oval, exit right' }
            },
            'b': {
                path: 'M 0 180 L 15 60 Q 20 50 30 55 Q 35 65 25 80 L 15 120 L 15 180 Q 20 160 35 150 Q 50 145 55 160 Q 58 175 50 185 Q 40 190 25 185 Q 15 180 15 180 L 60 175',
                width: 60,
                instructions: { steps: ['Tall stroke up', 'Loop down', 'Bump right'], tip: 'Start at baseline, go tall, loop and bump' }
            },
            'c': {
                path: 'M 0 180 Q 5 160 15 140 Q 30 110 50 105 Q 60 105 60 115 M 50 105 Q 30 110 15 135 Q 5 160 10 180 Q 20 195 40 185 Q 55 175 60 165',
                width: 60,
                instructions: { steps: ['Upstroke', 'Curve around', 'Exit'], tip: 'Open curve like a crescent' }
            },
            'd': {
                path: 'M 0 180 Q 5 160 20 140 Q 35 115 50 110 Q 60 110 55 130 Q 50 150 40 175 Q 30 195 20 185 Q 5 175 10 150 Q 20 125 40 115 Q 50 110 50 110 L 50 60 Q 55 50 60 55 L 50 180 Q 55 175 65 170',
                width: 65,
                instructions: { steps: ['Oval first', 'Tall stroke', 'Down and exit'], tip: 'Make round part, go tall, exit' }
            },
            'e': {
                path: 'M 0 180 Q 5 165 15 145 Q 25 125 35 120 Q 45 118 45 130 Q 42 140 30 145 Q 15 150 10 165 Q 8 180 20 188 Q 35 192 50 180 Q 58 170 60 165',
                width: 60,
                instructions: { steps: ['Upstroke', 'Small loop', 'Around and exit'], tip: 'Tiny loop in middle' }
            },
            'f': {
                path: 'M 15 55 Q 25 45 40 50 Q 50 58 45 75 L 25 180 Q 15 210 5 220 Q -5 225 -10 215 M 5 120 L 50 120',
                width: 50,
                instructions: { steps: ['Top curve', 'Long stroke down', 'Cross'], tip: 'Goes above and below lines' }
            },
            'g': {
                path: 'M 0 180 Q 5 160 20 140 Q 35 115 50 110 Q 60 110 55 130 Q 50 150 40 175 Q 30 195 20 185 Q 5 175 10 150 Q 20 125 40 115 Q 50 110 50 110 L 50 180 Q 55 200 50 220 Q 40 240 20 235 Q 5 225 10 215',
                width: 60,
                instructions: { steps: ['Oval', 'Down below baseline', 'Curve back'], tip: 'Like a with descending tail' }
            },
            'h': {
                path: 'M 0 180 L 15 60 Q 20 50 30 55 Q 35 65 25 80 L 15 130 Q 20 115 35 110 Q 55 108 60 130 Q 62 150 55 175 L 55 180 Q 60 175 70 170',
                width: 70,
                instructions: { steps: ['Tall stroke', 'Down', 'Hump right'], tip: 'Like n with tall stem' }
            },
            'i': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 180 Q 33 175 43 170 M 28 95 L 30 100',
                width: 43,
                instructions: { steps: ['Upstroke', 'Down', 'Dot'], tip: 'Simple stroke with dot' }
            },
            'j': {
                path: 'M 5 180 Q 10 165 20 145 Q 27 125 33 120 L 33 180 Q 38 210 30 230 Q 20 245 5 240 Q -5 230 0 220 M 33 95 L 35 100',
                width: 45,
                instructions: { steps: ['Upstroke', 'Down and curve', 'Dot'], tip: 'Like i with tail below' }
            },
            'k': {
                path: 'M 0 180 L 15 60 Q 20 50 30 55 Q 35 65 25 80 L 15 180 M 55 110 Q 40 130 20 145 M 25 145 Q 40 165 55 185 Q 60 180 65 175',
                width: 65,
                instructions: { steps: ['Tall stroke', 'Kick in', 'Kick out'], tip: 'Kicks meet in middle' }
            },
            'l': {
                path: 'M 0 180 L 20 60 Q 25 50 35 55 Q 40 65 30 80 L 20 180 Q 25 175 40 170',
                width: 40,
                instructions: { steps: ['Tall loop', 'Down', 'Exit'], tip: 'Elegant tall stroke' }
            },
            'm': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 180 Q 30 150 45 120 Q 55 115 58 130 L 58 180 Q 60 150 75 120 Q 85 115 88 130 L 88 180 Q 93 175 100 170',
                width: 100,
                instructions: { steps: ['Up', 'First hump', 'Second hump'], tip: 'Two humps side by side' }
            },
            'n': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 180 Q 30 150 45 120 Q 60 115 65 135 L 65 180 Q 70 175 80 170',
                width: 80,
                instructions: { steps: ['Upstroke', 'Down', 'Hump'], tip: 'One smooth hill' }
            },
            'o': {
                path: 'M 0 180 Q 5 165 20 145 Q 35 125 50 125 Q 65 130 65 155 Q 60 180 45 190 Q 25 195 15 180 Q 5 165 15 145 M 60 160 Q 65 165 75 170',
                width: 75,
                instructions: { steps: ['Oval', 'Close', 'Exit'], tip: 'Round oval with connector' }
            },
            'p': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 240 M 28 180 Q 30 150 45 130 Q 60 125 65 145 Q 68 165 55 185 Q 40 195 28 180 M 62 155 Q 70 165 75 170',
                width: 75,
                instructions: { steps: ['Down below', 'Up', 'Bump'], tip: 'Stem below, bump on top' }
            },
            'q': {
                path: 'M 0 180 Q 5 160 20 140 Q 35 120 50 120 Q 65 125 60 150 Q 55 175 40 190 Q 25 195 15 180 Q 5 165 15 145 M 55 150 L 55 240 Q 60 250 75 245',
                width: 75,
                instructions: { steps: ['Oval', 'Down below', 'Exit right'], tip: 'Tail goes right' }
            },
            'r': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 180 Q 30 155 45 130 Q 55 120 60 130',
                width: 55,
                instructions: { steps: ['Up', 'Down', 'Shoulder'], tip: 'Short with small shoulder' }
            },
            's': {
                path: 'M 0 180 Q 5 165 20 150 Q 35 130 50 125 Q 60 125 55 140 Q 48 155 35 160 Q 20 165 15 180 Q 15 195 30 195 Q 50 190 60 175',
                width: 60,
                instructions: { steps: ['Up', 'Snake curve', 'Exit'], tip: 'S-curve like snake' }
            },
            't': {
                path: 'M 0 180 Q 5 165 18 130 Q 25 100 30 80 L 30 180 Q 35 175 50 170 M 10 120 L 45 120',
                width: 50,
                instructions: { steps: ['Up', 'Down', 'Cross'], tip: 'Shorter than l, cross it' }
            },
            'u': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 160 Q 30 185 50 185 Q 65 180 65 155 Q 65 130 60 120 L 60 180 Q 65 175 75 170',
                width: 75,
                instructions: { steps: ['Up', 'Down curve', 'Up and down'], tip: 'Like upside-down n' }
            },
            'v': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 40 180 L 55 120 Q 60 125 65 140',
                width: 60,
                instructions: { steps: ['Up', 'Down', 'Up'], tip: 'Sharp point at bottom' }
            },
            'w': {
                path: 'M 0 180 Q 5 165 15 145 Q 20 125 25 120 L 35 180 L 50 130 L 60 180 L 75 120 Q 80 125 85 140',
                width: 85,
                instructions: { steps: ['Up', 'Down-up', 'Down-up'], tip: 'Two V shapes' }
            },
            'x': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 30 120 L 55 180 Q 60 175 65 170 M 60 120 L 15 180',
                width: 65,
                instructions: { steps: ['Diagonal', 'Cross diagonal'], tip: 'Strokes cross in center' }
            },
            'y': {
                path: 'M 0 180 Q 5 165 15 145 Q 22 125 28 120 L 28 160 Q 30 185 50 185 Q 65 180 65 155 Q 65 130 60 120 L 60 180 Q 65 210 55 235 Q 40 250 20 240',
                width: 70,
                instructions: { steps: ['U-shape', 'Descending tail'], tip: 'Like u with tail' }
            },
            'z': {
                path: 'M 0 180 Q 5 165 15 145 Q 25 125 35 120 L 60 120 L 15 180 L 60 180 Q 65 175 70 170',
                width: 70,
                instructions: { steps: ['Up', 'Across', 'Diagonal', 'Across'], tip: 'Zigzag pattern' }
            },
            ' ': {
                path: '',
                width: 30,
                instructions: { steps: ['Lift', 'Move'], tip: 'Space between words' }
            }
        };

        const defaultInstruction = { steps: ['Follow shape'], tip: 'Watch and follow!' };

        // State
        let svg;
        let currentWord = '', displayWord = '';
        let currentIndex = 0;
        let isAnimating = false, isPaused = false;
        let animationId = null;
        let letterPaths = [];

        function init() {
            svg = document.getElementById('writingSvg');
            buildLetterGrid();
            updateSpeedLabel();
            drawGuidelines();
            startWriting();
        }

        function drawGuidelines() {
            const width = svg.clientWidth || 700;

            // Clear and redraw guidelines
            const guidelines = `
                <line x1="0" y1="60" x2="${width}" y2="60" class="guideline guideline-top"/>
                <line x1="0" y1="110" x2="${width}" y2="110" class="guideline guideline-mid"/>
                <line x1="0" y1="180" x2="${width}" y2="180" class="guideline guideline-base"/>
                <line x1="0" y1="230" x2="${width}" y2="230" class="guideline guideline-desc"/>
            `;

            // Keep guidelines at the start
            const existingContent = svg.innerHTML.replace(/<line[^>]*class="guideline[^"]*"[^>]*\/>/g, '');
            svg.innerHTML = guidelines + existingContent;
        }

        function buildLetterGrid() {
            const grid = document.getElementById('letterGrid');
            'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => setWord(letter);
                grid.appendChild(btn);
            });
        }

        function setWord(word) {
            document.getElementById('wordInput').value = word;
            startWriting();
        }

        function startWriting() {
            cancelAnimation();

            currentWord = document.getElementById('wordInput').value.trim().toLowerCase();
            if (!currentWord) return;

            displayWord = currentWord;
            currentIndex = 0;
            isAnimating = true;
            isPaused = false;
            letterPaths = [];
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            // Build progress
            const progressRow = document.getElementById('progressRow');
            progressRow.innerHTML = '';
            displayWord.split('').forEach((char, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.textContent = char;
                dot.onclick = () => jumpTo(i);
                progressRow.appendChild(dot);
            });

            // Clear SVG and redraw guidelines
            svg.innerHTML = '';
            drawGuidelines();

            // Build letter paths
            buildLetterPaths();

            updateProgress();
            showInstruction(0);
            animateLetter();
        }

        function buildLetterPaths() {
            let xOffset = 30;
            const color = document.getElementById('colorSelect').value;
            const strokeWidth = document.getElementById('sizeSelect').value;

            displayWord.split('').forEach((char, index) => {
                const letterData = cursiveLetters[char] || cursiveLetters['a'];

                if (letterData.path) {
                    // Create guide path (light gray)
                    const guidePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    guidePath.setAttribute('d', translatePath(letterData.path, xOffset, 0));
                    guidePath.setAttribute('class', 'letter-path letter-guide');
                    guidePath.setAttribute('data-index', index);
                    svg.appendChild(guidePath);

                    // Create animated path
                    const drawPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    drawPath.setAttribute('d', translatePath(letterData.path, xOffset, 0));
                    drawPath.setAttribute('class', 'letter-path letter-draw');
                    drawPath.setAttribute('stroke', color);
                    drawPath.setAttribute('stroke-width', strokeWidth);
                    drawPath.setAttribute('data-index', index);

                    // Set up stroke animation
                    const length = drawPath.getTotalLength ? drawPath.getTotalLength() : 1000;
                    drawPath.style.strokeDasharray = length;
                    drawPath.style.strokeDashoffset = length;

                    svg.appendChild(drawPath);

                    letterPaths.push({
                        element: drawPath,
                        length: length,
                        index: index
                    });
                }

                xOffset += letterData.width;
            });
        }

        function translatePath(pathData, dx, dy) {
            // Translate all coordinates in path by dx, dy
            return pathData.replace(/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g, (match, x, y) => {
                return `${parseFloat(x) + dx} ${parseFloat(y) + dy}`;
            });
        }

        function updateProgress() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentIndex) dot.classList.add('done');
                else if (i === currentIndex) dot.classList.add('current');
            });
        }

        function showInstruction(index) {
            const letterSpan = document.getElementById('currentLetter');
            const textDiv = document.getElementById('instructionText');
            const stepsDiv = document.getElementById('strokeSteps');

            if (index >= displayWord.length) {
                letterSpan.textContent = '✓';
                textDiv.innerHTML = '<strong>Great job!</strong> You completed the word!';
                stepsDiv.innerHTML = '';
                return;
            }

            const char = displayWord[index];
            letterSpan.textContent = char;

            const letterData = cursiveLetters[char];
            const info = letterData ? letterData.instructions : defaultInstruction;
            textDiv.innerHTML = `<strong>Tip:</strong> ${info.tip}`;
            stepsDiv.innerHTML = info.steps.map((step, i) =>
                `<div class="stroke-step"><span class="step-num">${i+1}</span>${step}</div>`
            ).join('');
        }

        function animateLetter() {
            if (!isAnimating || isPaused) return;
            if (currentIndex >= letterPaths.length) {
                currentIndex = displayWord.length;
                updateProgress();
                showInstruction(currentIndex);
                isAnimating = false;
                return;
            }

            const pathData = letterPaths[currentIndex];
            const speed = parseInt(document.getElementById('speedSlider').value);
            const duration = (11 - speed) * 300; // ms

            const startTime = performance.now();

            function animate(currentTime) {
                if (!isAnimating || isPaused) return;

                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Ease-in-out for natural feel
                const eased = progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                const offset = pathData.length * (1 - eased);
                pathData.element.style.strokeDashoffset = offset;

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    currentIndex++;
                    updateProgress();
                    showInstruction(currentIndex);

                    if (currentIndex < letterPaths.length) {
                        setTimeout(() => animateLetter(), 150);
                    } else {
                        isAnimating = false;
                    }
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function cancelAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isAnimating = false;
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                btn.textContent = '⏸️ Pause';
                animateLetter();
            } else {
                isPaused = true;
                btn.textContent = '▶️ Resume';
            }
        }

        function showLettersUpTo(index) {
            letterPaths.forEach((pathData, i) => {
                if (i < index) {
                    pathData.element.style.strokeDashoffset = 0;
                } else {
                    pathData.element.style.strokeDashoffset = pathData.length;
                }
            });
        }

        function prevLetter() {
            if (currentIndex > 0) {
                cancelAnimation();
                currentIndex--;
                showLettersUpTo(currentIndex);
                updateProgress();
                showInstruction(currentIndex);
                isAnimating = true;
                isPaused = false;
                animateLetter();
            }
        }

        function nextLetter() {
            if (currentIndex < letterPaths.length) {
                cancelAnimation();
                letterPaths[currentIndex].element.style.strokeDashoffset = 0;
                currentIndex++;
                updateProgress();
                showInstruction(currentIndex);

                if (currentIndex < letterPaths.length) {
                    isAnimating = true;
                    isPaused = false;
                    animateLetter();
                }
            }
        }

        function jumpTo(index) {
            cancelAnimation();
            showLettersUpTo(index);
            currentIndex = index;
            updateProgress();
            showInstruction(currentIndex);

            if (currentIndex < letterPaths.length) {
                isAnimating = true;
                isPaused = false;
                animateLetter();
            }
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speedSlider').value;
            const labels = ['', 'Very Slow', 'Slow', 'Slow', 'Medium-Slow', 'Medium', 'Medium', 'Medium-Fast', 'Fast', 'Fast', 'Very Fast'];
            document.getElementById('speedLabel').textContent = labels[val];
        }

        window.onload = init;
        window.onresize = () => {
            if (svg) drawGuidelines();
        };
    </script>
</body>
</html>
