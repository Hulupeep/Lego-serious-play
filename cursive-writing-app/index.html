<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Writing Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico&family=Satisfy&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-pink { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-gray { background: #eee; color: #333; }

        /* Copybook area */
        .copybook {
            background: linear-gradient(to bottom,
                transparent 0px, transparent 59px, #ffcccc 59px, #ffcccc 60px,
                transparent 60px, transparent 99px, #4444ff 99px, #4444ff 101px,
                transparent 101px, transparent 139px, #cccccc 139px, #cccccc 140px,
                transparent 140px
            );
            background-size: 100% 140px;
            background-color: #fffef8;
            border: 2px solid #ddd;
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .copybook-labels {
            position: absolute;
            right: 8px;
            top: 0;
            font-size: 9px;
            color: #999;
            pointer-events: none;
        }

        .copybook-labels span {
            position: absolute;
            right: 0;
            white-space: nowrap;
        }

        .label-top { top: 52px; }
        .label-mid { top: 92px; color: #ff6666; }
        .label-base { top: 132px; color: #4444ff; }

        .writing-display {
            padding: 20px 30px;
            min-height: 160px;
            display: flex;
            align-items: flex-end;
            padding-bottom: 45px;
            position: relative;
        }

        .cursive-text {
            position: relative;
            font-size: 72px;
            font-family: 'Dancing Script', cursive;
            white-space: nowrap;
        }

        .cursive-text.style-modern { font-family: 'Dancing Script', cursive; }
        .cursive-text.style-traditional { font-family: 'Satisfy', cursive; }
        .cursive-text.style-italic { font-family: 'Great Vibes', cursive; font-size: 80px; }
        .cursive-text.style-fancy { font-family: 'Pacifico', cursive; }

        #textOutline {
            color: transparent;
            -webkit-text-stroke: 1px #ccc;
        }

        #textFill {
            position: absolute;
            left: 0;
            top: 0;
            color: #333;
            clip-path: inset(0 100% 0 0);
        }

        /* Pen cursor for writing effect */
        .pen-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            pointer-events: none;
            transform: translate(-8px, -20px) rotate(-45deg);
            transition: opacity 0.2s;
            z-index: 10;
        }

        .pen-cursor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }

        /* Ink trail effect */
        .ink-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            opacity: 0;
            animation: inkFade 0.5s ease-out forwards;
        }

        @keyframes inkFade {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.3); }
        }

        /* Writing animation glow */
        .writing-glow {
            position: absolute;
            left: 0;
            top: 0;
            color: transparent;
            -webkit-text-stroke: 3px rgba(102, 126, 234, 0.3);
            clip-path: inset(0 100% 0 0);
            filter: blur(2px);
        }

        /* Progress dots */
        .progress-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .progress-dot.done { background: #4caf50; color: white; }
        .progress-dot.current {
            background: #667eea;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(102,126,234,0.5);
        }

        /* Instruction box */
        .instruction-box {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #ffc107;
            margin-top: 15px;
        }

        .instruction-box h3 {
            color: #f57f17;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-letter-display {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            color: #667eea;
        }

        .instruction-text {
            color: #5d4037;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel h3 {
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1em;
        }

        .setting-row {
            margin-bottom: 12px;
        }

        .setting-row label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.9em;
        }

        .setting-row select, .setting-row input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .style-preview {
            text-align: center;
            font-size: 1.6em;
            padding: 8px;
            background: #f8f8f8;
            border-radius: 6px;
            margin-top: 4px;
        }

        .style-preview.style-modern { font-family: 'Dancing Script', cursive; }
        .style-preview.style-traditional { font-family: 'Satisfy', cursive; }
        .style-preview.style-italic { font-family: 'Great Vibes', cursive; }
        .style-preview.style-fancy { font-family: 'Pacifico', cursive; }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .letter-btn {
            padding: 6px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-family: 'Dancing Script', cursive;
            font-size: 1.2em;
        }

        .letter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #f0f4ff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .word-chip:hover {
            background: #667eea;
            color: white;
        }

        .speed-label {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* Letter stroke guide */
        .stroke-guide {
            background: #f0f8ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .stroke-guide h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .stroke-steps {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stroke-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
        }

        .step-num {
            width: 20px;
            height: 20px;
            background: #1976d2;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Cursive Writing Practice</h1>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="input-row">
                    <input type="text" id="wordInput" placeholder="Type a word..." value="hello">
                    <button class="btn btn-primary" onclick="startWriting()">Write It!</button>
                    <button class="btn btn-pink" onclick="startWriting()">🔄 Repeat</button>
                </div>

                <div class="progress-row" id="progressRow"></div>

                <div class="copybook">
                    <div class="copybook-labels">
                        <span class="label-top">Top (tall letters)</span>
                        <span class="label-mid">Midline</span>
                        <span class="label-base">Baseline</span>
                    </div>
                    <div class="writing-display">
                        <div class="cursive-text" id="cursiveText">
                            <span id="textOutline"></span>
                            <span class="writing-glow" id="textGlow"></span>
                            <span id="textFill"></span>
                        </div>
                        <div class="pen-cursor" id="penCursor">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 21L5 14L18 1L23 6L10 19L3 21Z" fill="#8B4513" stroke="#5D3A1A" stroke-width="1"/>
                                <path d="M5 14L10 19" stroke="#5D3A1A" stroke-width="1"/>
                                <path d="M18 1L23 6" stroke="#5D3A1A" stroke-width="1"/>
                                <path d="M3 21L5 19L5 14L3 21Z" fill="#333"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="instruction-box">
                    <h3>💡 How to Write: <span class="current-letter-display" id="currentLetter">h</span></h3>
                    <div class="instruction-text" id="instructionText">
                        Type a word and click "Write It!" to begin.
                    </div>
                    <div class="stroke-guide" id="strokeGuide">
                        <h4>Stroke Order:</h4>
                        <div class="stroke-steps" id="strokeSteps"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-gray" onclick="prevLetter()">⬅️ Prev</button>
                    <button class="btn btn-gray" onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
                    <button class="btn btn-gray" onclick="nextLetter()">Next ➡️</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="card panel">
                    <h3>⚙️ Settings</h3>

                    <div class="setting-row">
                        <label>Cursive Style</label>
                        <select id="styleSelect" onchange="updateStyle()">
                            <option value="modern">Modern (Dancing Script)</option>
                            <option value="traditional">Traditional (Satisfy)</option>
                            <option value="italic">Elegant (Great Vibes)</option>
                            <option value="fancy">Fancy (Pacifico)</option>
                        </select>
                        <div class="style-preview style-modern" id="stylePreview">hello</div>
                    </div>

                    <div class="setting-row">
                        <label>Letter Case</label>
                        <select id="caseSelect" onchange="startWriting()">
                            <option value="lower">All Lowercase</option>
                            <option value="upper">All Uppercase</option>
                            <option value="mixed">As Typed</option>
                            <option value="title">Title Case</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="10" value="5" onchange="updateSpeedLabel()">
                        <div class="speed-label" id="speedLabel">Medium</div>
                    </div>

                    <div class="setting-row">
                        <label>Size</label>
                        <select id="sizeSelect" onchange="updateSize()">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Color</label>
                        <select id="colorSelect" onchange="updateColor()">
                            <option value="#333333">Black</option>
                            <option value="#1a237e">Navy Blue</option>
                            <option value="#4a148c">Purple</option>
                            <option value="#b71c1c">Red</option>
                            <option value="#1b5e20">Green</option>
                        </select>
                    </div>
                </div>

                <div class="card panel">
                    <h3>🔤 Letters</h3>
                    <div class="letter-grid" id="letterGrid"></div>
                </div>

                <div class="card panel">
                    <h3>📚 Words</h3>
                    <div class="word-chips">
                        <span class="word-chip" onclick="setWord('cat')">cat</span>
                        <span class="word-chip" onclick="setWord('dog')">dog</span>
                        <span class="word-chip" onclick="setWord('hello')">hello</span>
                        <span class="word-chip" onclick="setWord('world')">world</span>
                        <span class="word-chip" onclick="setWord('apple')">apple</span>
                        <span class="word-chip" onclick="setWord('happy')">happy</span>
                        <span class="word-chip" onclick="setWord('love')">love</span>
                        <span class="word-chip" onclick="setWord('school')">school</span>
                        <span class="word-chip" onclick="setWord('write')">write</span>
                        <span class="word-chip" onclick="setWord('the quick fox')">quick fox</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Letter instruction data
        const letterInstructions = {
            'a': {
                steps: ['Start at midline', 'Curve left and down', 'Loop back up', 'Stroke down and exit right'],
                tip: 'Make a small oval, then exit with an upstroke to connect.'
            },
            'b': {
                steps: ['Start at baseline', 'Tall stroke up', 'Loop at top', 'Down and bump right'],
                tip: 'The loop goes to the top line. The bump sits between midline and baseline.'
            },
            'c': {
                steps: ['Start below midline', 'Curve up and left', 'Sweep down', 'Exit with upturn'],
                tip: 'Keep it open like a crescent moon.'
            },
            'd': {
                steps: ['Start like c', 'Curve around', 'Tall stroke up', 'Down and exit'],
                tip: 'Make the round part first, then go up tall.'
            },
            'e': {
                steps: ['Start at middle', 'Small loop up', 'Curve around', 'Exit right'],
                tip: 'The loop is tiny - like a small eye.'
            },
            'f': {
                steps: ['Curve at top', 'Tall stroke down', 'Below baseline', 'Cross at middle'],
                tip: 'This letter goes both above and below the lines!'
            },
            'g': {
                steps: ['Oval like a', 'Continue down', 'Below baseline', 'Curve left'],
                tip: 'The tail hooks back to the left below the line.'
            },
            'h': {
                steps: ['Start at baseline', 'Tall stroke up', 'Down to middle', 'Hump right'],
                tip: 'Like an n attached to a tall stem.'
            },
            'i': {
                steps: ['Short upstroke', 'Down to baseline', 'Exit right', 'Add dot'],
                tip: 'Keep it simple. Don\'t forget the dot!'
            },
            'j': {
                steps: ['Short upstroke', 'Down past baseline', 'Curve left', 'Add dot'],
                tip: 'Like i but with a tail below the line.'
            },
            'k': {
                steps: ['Tall stroke up', 'Down', 'Kick in', 'Kick out'],
                tip: 'The kicks meet at the middle of the tall stroke.'
            },
            'l': {
                steps: ['Start at baseline', 'Tall loop up', 'Down', 'Exit right'],
                tip: 'Keep it tall and elegant.'
            },
            'm': {
                steps: ['Upstroke', 'First hump', 'Second hump', 'Exit'],
                tip: 'Two mountains side by side - keep them even!'
            },
            'n': {
                steps: ['Upstroke', 'Over and down', 'One hump', 'Exit right'],
                tip: 'One smooth hill - half of an m.'
            },
            'o': {
                steps: ['Start at midline', 'Oval left', 'Close oval', 'Exit with connector'],
                tip: 'Round oval, then a little exit stroke.'
            },
            'p': {
                steps: ['Upstroke', 'Down below baseline', 'Back up', 'Bump right'],
                tip: 'Stem goes below the line. Bump on top half.'
            },
            'q': {
                steps: ['Oval like a', 'Down below baseline', 'Curve right', 'Exit'],
                tip: 'Tail curves right - opposite of g!'
            },
            'r': {
                steps: ['Upstroke', 'Shoulder curve', 'Exit'],
                tip: 'Short and simple - just a small shoulder.'
            },
            's': {
                steps: ['Upstroke', 'Curve left', 'Snake down', 'Curve right', 'Exit'],
                tip: 'Think of a snake! S-curve motion.'
            },
            't': {
                steps: ['Upstroke (not too tall)', 'Down', 'Exit', 'Cross at midline'],
                tip: 'Shorter than l. Cross it last!'
            },
            'u': {
                steps: ['Upstroke', 'Down and curve', 'Up like a cup', 'Down and exit'],
                tip: 'Like an upside-down n.'
            },
            'v': {
                steps: ['Upstroke', 'Diagonal down', 'Sharp point', 'Diagonal up'],
                tip: 'Sharp point at the bottom.'
            },
            'w': {
                steps: ['Upstroke', 'Down', 'Up', 'Down', 'Up and exit'],
                tip: 'Like two v shapes connected.'
            },
            'x': {
                steps: ['First diagonal', 'Second diagonal', 'Cross in middle'],
                tip: 'The strokes cross right in the center.'
            },
            'y': {
                steps: ['Like u top', 'Continue down', 'Below baseline', 'Curve left'],
                tip: 'Like u but with a descending tail.'
            },
            'z': {
                steps: ['Across top', 'Diagonal down', 'Across bottom', 'Exit'],
                tip: 'Zigzag pattern!'
            },
            ' ': {
                steps: ['Lift pen', 'Move right'],
                tip: 'Spaces separate words!'
            }
        };

        // Default for uppercase and unknown
        const defaultInstruction = {
            steps: ['Follow the letter shape', 'Smooth strokes', 'Connect to next'],
            tip: 'Watch the animation and follow along!'
        };

        // State
        let currentWord = '';
        let displayWord = '';
        let currentIndex = 0;
        let isAnimating = false;
        let isPaused = false;
        let animationId = null;

        // Init
        function init() {
            buildLetterGrid();
            updateSpeedLabel();
            updateStyle();
            startWriting();
        }

        function buildLetterGrid() {
            const grid = document.getElementById('letterGrid');
            'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => setWord(letter);
                grid.appendChild(btn);
            });
        }

        function setWord(word) {
            document.getElementById('wordInput').value = word;
            startWriting();
        }

        function applyCase(text) {
            const opt = document.getElementById('caseSelect').value;
            if (opt === 'lower') return text.toLowerCase();
            if (opt === 'upper') return text.toUpperCase();
            if (opt === 'title') return text.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
            return text;
        }

        function startWriting() {
            cancelAnimation();

            currentWord = document.getElementById('wordInput').value.trim();
            if (!currentWord) return;

            displayWord = applyCase(currentWord);
            currentIndex = 0;
            isAnimating = true;
            isPaused = false;
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            // Build progress dots
            const progressRow = document.getElementById('progressRow');
            progressRow.innerHTML = '';
            displayWord.split('').forEach((char, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.textContent = char;
                dot.onclick = () => jumpTo(i);
                progressRow.appendChild(dot);
            });

            // Setup text display
            const outline = document.getElementById('textOutline');
            const fill = document.getElementById('textFill');
            const glow = document.getElementById('textGlow');
            outline.textContent = displayWord;
            fill.textContent = displayWord;
            glow.textContent = displayWord;

            // Reset clip paths
            fill.style.clipPath = 'inset(0 100% 0 0)';
            glow.style.clipPath = 'inset(0 100% 0 0)';

            // Position pen at start
            const pen = document.getElementById('penCursor');
            pen.style.opacity = '1';
            pen.style.left = '0px';
            pen.style.top = '50px';

            updateProgress();
            showInstruction(0);
            animateLetter();
        }

        function updateProgress() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentIndex) dot.classList.add('done');
                else if (i === currentIndex) dot.classList.add('current');
            });
        }

        function showInstruction(index) {
            const letterSpan = document.getElementById('currentLetter');
            const textDiv = document.getElementById('instructionText');
            const stepsDiv = document.getElementById('strokeSteps');

            if (index >= displayWord.length) {
                letterSpan.textContent = '✓';
                textDiv.innerHTML = '<strong>Great job!</strong> You completed the word!';
                stepsDiv.innerHTML = '';
                return;
            }

            const char = displayWord[index];
            letterSpan.textContent = char;

            const info = letterInstructions[char.toLowerCase()] || defaultInstruction;
            textDiv.innerHTML = `<strong>Tip:</strong> ${info.tip}`;

            stepsDiv.innerHTML = info.steps.map((step, i) =>
                `<div class="stroke-step"><span class="step-num">${i+1}</span>${step}</div>`
            ).join('');
        }

        function animateLetter() {
            if (!isAnimating || isPaused) return;
            if (currentIndex >= displayWord.length) {
                isAnimating = false;
                // Hide pen when done
                document.getElementById('penCursor').style.opacity = '0';
                return;
            }

            const fill = document.getElementById('textFill');
            const glow = document.getElementById('textGlow');
            const pen = document.getElementById('penCursor');
            const textContainer = document.getElementById('cursiveText');
            const speed = parseInt(document.getElementById('speedSlider').value);
            const duration = (11 - speed) * 250; // ms per letter

            // Calculate clip percentage for current letter
            const totalChars = displayWord.length;
            const startPercent = (currentIndex / totalChars) * 100;
            const endPercent = ((currentIndex + 1) / totalChars) * 100;

            // Calculate pen position based on text width
            const textWidth = textContainer.offsetWidth;
            const textHeight = textContainer.offsetHeight;

            let startTime = null;
            let lastInkTime = 0;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                if (isPaused) return;

                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Use easing for more natural writing motion
                const easeProgress = easeInOutQuad(progress);

                const currentPercent = startPercent + (endPercent - startPercent) * easeProgress;
                fill.style.clipPath = `inset(0 ${100 - currentPercent}% 0 0)`;
                glow.style.clipPath = `inset(0 ${100 - currentPercent - 2}% 0 0)`;

                // Move pen cursor
                const penX = (currentPercent / 100) * textWidth;
                // Add slight vertical wobble for natural writing feel
                const wobble = Math.sin(progress * Math.PI * 4) * 3;
                const penY = 50 + wobble;
                pen.style.left = penX + 'px';
                pen.style.top = penY + 'px';

                // Add ink dots occasionally for trail effect
                if (timestamp - lastInkTime > 80 && progress < 0.95) {
                    createInkDot(penX + 30, penY + 70);
                    lastInkTime = timestamp;
                }

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    currentIndex++;
                    updateProgress();
                    showInstruction(currentIndex);

                    if (currentIndex < displayWord.length) {
                        setTimeout(() => animateLetter(), 100);
                    } else {
                        isAnimating = false;
                        pen.style.opacity = '0';
                    }
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        // Easing function for natural motion
        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        // Create ink dot for trail effect
        function createInkDot(x, y) {
            const display = document.querySelector('.writing-display');
            const dot = document.createElement('div');
            dot.className = 'ink-dot';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            dot.style.color = document.getElementById('colorSelect').value;
            display.appendChild(dot);

            // Remove after animation
            setTimeout(() => dot.remove(), 500);
        }

        function cancelAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            isAnimating = false;
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                btn.textContent = '⏸️ Pause';
                animateLetter();
            } else {
                isPaused = true;
                btn.textContent = '▶️ Resume';
            }
        }

        function updateClipAndPen(percent) {
            const fill = document.getElementById('textFill');
            const glow = document.getElementById('textGlow');
            const pen = document.getElementById('penCursor');
            const textContainer = document.getElementById('cursiveText');

            fill.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
            glow.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;

            const penX = (percent / 100) * textContainer.offsetWidth;
            pen.style.left = penX + 'px';
            pen.style.top = '50px';
            pen.style.opacity = percent < 100 ? '1' : '0';
        }

        function prevLetter() {
            if (currentIndex > 0) {
                cancelAnimation();
                currentIndex--;

                const percent = (currentIndex / displayWord.length) * 100;
                updateClipAndPen(percent);

                updateProgress();
                showInstruction(currentIndex);
                isAnimating = true;
                isPaused = false;
                animateLetter();
            }
        }

        function nextLetter() {
            if (currentIndex < displayWord.length) {
                cancelAnimation();
                currentIndex++;

                const percent = (currentIndex / displayWord.length) * 100;
                updateClipAndPen(percent);

                updateProgress();
                showInstruction(currentIndex);

                if (currentIndex < displayWord.length) {
                    isAnimating = true;
                    isPaused = false;
                    animateLetter();
                }
            }
        }

        function jumpTo(index) {
            cancelAnimation();
            currentIndex = index;

            const percent = (currentIndex / displayWord.length) * 100;
            updateClipAndPen(percent);

            updateProgress();
            showInstruction(currentIndex);
            isAnimating = true;
            isPaused = false;
            animateLetter();
        }

        function updateStyle() {
            const style = document.getElementById('styleSelect').value;
            const text = document.getElementById('cursiveText');
            const preview = document.getElementById('stylePreview');
            const glow = document.getElementById('textGlow');

            text.className = 'cursive-text style-' + style;
            preview.className = 'style-preview style-' + style;

            if (displayWord) startWriting();
        }

        function updateSize() {
            const size = document.getElementById('sizeSelect').value;
            const text = document.getElementById('cursiveText');
            const sizes = { small: '52px', medium: '72px', large: '92px' };
            text.style.fontSize = sizes[size];
        }

        function updateColor() {
            const color = document.getElementById('colorSelect').value;
            const outline = document.getElementById('textOutline');
            const fill = document.getElementById('textFill');
            // Keep outline light, just change fill color
            fill.style.color = color;
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speedSlider').value;
            const labels = ['', 'Very Slow', 'Slow', 'Slow', 'Medium-Slow', 'Medium', 'Medium', 'Medium-Fast', 'Fast', 'Fast', 'Very Fast'];
            document.getElementById('speedLabel').textContent = labels[val];
        }

        window.onload = init;
    </script>
</body>
</html>
