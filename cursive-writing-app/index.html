<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursive Writing Practice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .input-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-pink { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-gray { background: #eee; color: #333; }

        .copybook {
            background: #fffef8;
            border: 2px solid #ddd;
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
            margin: 15px 0;
        }

        .copybook-labels {
            position: absolute;
            right: 8px;
            top: 0;
            font-size: 9px;
            color: #999;
            pointer-events: none;
            z-index: 10;
        }

        .copybook-labels span {
            position: absolute;
            right: 0;
            white-space: nowrap;
        }

        .label-top { top: 48px; }
        .label-mid { top: 108px; color: #ff6666; }
        .label-base { top: 168px; color: #4444ff; }
        .label-desc { top: 218px; color: #999; }

        #writingCanvas {
            display: block;
            width: 100%;
            height: 280px;
        }

        .progress-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.2s;
            font-style: italic;
        }

        .progress-dot.done { background: #4caf50; color: white; }
        .progress-dot.current {
            background: #667eea;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(102,126,234,0.5);
        }

        .instruction-box {
            background: linear-gradient(135deg, #fff9c4, #fff59d);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid #ffc107;
            margin-top: 15px;
        }

        .instruction-box h3 {
            color: #f57f17;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-letter-display {
            font-size: 2.5em;
            font-style: italic;
            color: #667eea;
        }

        .instruction-text {
            color: #5d4037;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }

        .panel h3 {
            color: #667eea;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1em;
        }

        .setting-row { margin-bottom: 12px; }

        .setting-row label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 0.9em;
        }

        .setting-row select, .setting-row input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .letter-btn {
            padding: 8px 4px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 1.3em;
            font-style: italic;
        }

        .letter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .word-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .word-chip {
            padding: 6px 12px;
            background: #f0f4ff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.95em;
            font-style: italic;
        }

        .word-chip:hover {
            background: #667eea;
            color: white;
        }

        .speed-label {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stroke-guide {
            background: #f0f8ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .stroke-guide h4 {
            color: #1976d2;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .stroke-steps {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stroke-step {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85em;
            padding: 4px 8px;
            background: #e3f2fd;
            border-radius: 4px;
        }

        .stroke-step.active {
            background: #1976d2;
            color: white;
        }

        .step-num {
            width: 18px;
            height: 18px;
            background: #1976d2;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: bold;
        }

        .stroke-step.active .step-num {
            background: white;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Cursive Writing Practice</h1>
        </header>

        <div class="main-content">
            <div class="card">
                <div class="input-row">
                    <input type="text" id="wordInput" placeholder="Type a word..." value="hello">
                    <button class="btn btn-primary" onclick="startWriting()">Write It!</button>
                    <button class="btn btn-pink" onclick="startWriting()">🔄 Repeat</button>
                </div>

                <div class="progress-row" id="progressRow"></div>

                <div class="copybook">
                    <div class="copybook-labels">
                        <span class="label-top">Ascender</span>
                        <span class="label-mid">x-height</span>
                        <span class="label-base">Baseline</span>
                        <span class="label-desc">Descender</span>
                    </div>
                    <canvas id="writingCanvas"></canvas>
                </div>

                <div class="instruction-box">
                    <h3>💡 How to Write: <span class="current-letter-display" id="currentLetter">h</span></h3>
                    <div class="instruction-text" id="instructionText">
                        Type a word and click "Write It!" to begin.
                    </div>
                    <div class="stroke-guide">
                        <h4>Stroke Order:</h4>
                        <div class="stroke-steps" id="strokeSteps"></div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-gray" onclick="prevLetter()">⬅️ Prev</button>
                    <button class="btn btn-gray" onclick="togglePause()" id="pauseBtn">⏸️ Pause</button>
                    <button class="btn btn-gray" onclick="nextLetter()">Next ➡️</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="card panel">
                    <h3>⚙️ Settings</h3>

                    <div class="setting-row">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="1" max="10" value="5" onchange="updateSpeedLabel()">
                        <div class="speed-label" id="speedLabel">Medium</div>
                    </div>

                    <div class="setting-row">
                        <label>Pen Size</label>
                        <select id="sizeSelect">
                            <option value="2">Fine</option>
                            <option value="3" selected>Medium</option>
                            <option value="4">Bold</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Ink Color</label>
                        <select id="colorSelect">
                            <option value="#1a237e">Navy Blue</option>
                            <option value="#000000">Black</option>
                            <option value="#4a148c">Purple</option>
                            <option value="#b71c1c">Red</option>
                            <option value="#1b5e20">Green</option>
                        </select>
                    </div>
                </div>

                <div class="card panel">
                    <h3>🔤 Letters</h3>
                    <div class="letter-grid" id="letterGrid"></div>
                </div>

                <div class="card panel">
                    <h3>📚 Practice Words</h3>
                    <div class="word-chips">
                        <span class="word-chip" onclick="setWord('cat')">cat</span>
                        <span class="word-chip" onclick="setWord('dog')">dog</span>
                        <span class="word-chip" onclick="setWord('hello')">hello</span>
                        <span class="word-chip" onclick="setWord('love')">love</span>
                        <span class="word-chip" onclick="setWord('happy')">happy</span>
                        <span class="word-chip" onclick="setWord('sun')">sun</span>
                        <span class="word-chip" onclick="setWord('moon')">moon</span>
                        <span class="word-chip" onclick="setWord('star')">star</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /*
         * CURSIVE STROKE ORDER DATA
         *
         * Each letter is defined with exact human stroke order.
         * Coordinates: 0-100 scale, transformed to actual size
         * baseline = 70, x-height (midline) = 40, ascender = 10, descender = 95
         *
         * Each stroke has:
         * - points: array of [x, y] coordinates for the pen path
         * - The pen follows these points in order (like connect-the-dots)
         * - Bezier curves are interpolated between points for smoothness
         */

        const BASELINE = 70;
        const MIDLINE = 40;
        const ASCENDER = 10;
        const DESCENDER = 95;

        /*
         * CURSIVE STROKE DATA - TRUE SINGLE-STROKE PATHS
         *
         * In real cursive, the pen RARELY lifts. Most letters are ONE continuous stroke.
         * Pen only lifts for: dots (i,j) and crosses (t,f,x)
         *
         * Each path follows the exact motion a human hand makes.
         */
        const letterStrokes = {
            'a': {
                width: 50,
                // ONE stroke: entry → up → oval → back to stem → down → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [10, MIDLINE], [20, 35], [35, 35], [45, MIDLINE], [45, 55], [40, 65], [25, BASELINE], [10, 65], [10, 55], [15, MIDLINE], [45, MIDLINE], [45, BASELINE], [50, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One fluid motion: up, around the oval, retrace to stem, down, exit.'
            },
            'b': {
                width: 50,
                // ONE stroke: up tall → loop → down → bump → exit
                strokes: [
                    [[0, BASELINE], [5, 50], [10, 25], [15, ASCENDER], [20, 15], [18, 25], [15, MIDLINE], [15, BASELINE], [15, 55], [25, 45], [40, 45], [48, 55], [45, 68], [30, BASELINE], [15, 65], [48, 62], [52, 58]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up tall with loop, down, make bump, exit.'
            },
            'c': {
                width: 45,
                // ONE stroke: entry → up → around → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, 35], [38, 38], [38, 38], [25, 38], [12, 45], [8, 55], [10, 65], [22, BASELINE], [38, 68], [45, 60]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One fluid curve: up, around like a C, exit right.'
            },
            'd': {
                width: 55,
                // ONE stroke: entry → oval → up tall → down → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, 35], [40, 38], [45, 50], [42, 65], [28, BASELINE], [12, 68], [8, 55], [12, MIDLINE], [45, MIDLINE], [45, 25], [48, ASCENDER], [50, 15], [48, 25], [45, MIDLINE], [45, BASELINE], [55, 62]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: oval first, up tall, back down with exit.'
            },
            'e': {
                width: 40,
                // ONE stroke: entry → up → loop → around → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, 45], [20, MIDLINE], [28, 42], [30, 48], [25, 52], [15, 52], [8, 58], [8, 68], [18, BASELINE+5], [32, BASELINE], [40, 62]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up with tiny loop, curve around, exit.'
            },
            'f': {
                width: 45,
                // TWO strokes: main body, then cross
                strokes: [
                    [[10, 25], [18, 15], [28, ASCENDER], [35, 15], [32, 25], [28, MIDLINE], [22, BASELINE], [18, 85], [12, DESCENDER], [2, 92]],
                    [[8, 50], [35, 50]]
                ],
                strokeNames: ['Main stroke', 'Cross'],
                tip: 'First: curve at top, down past baseline. Then: cross stroke.'
            },
            'g': {
                width: 50,
                // ONE stroke: entry → oval → down tail
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, 35], [40, 38], [45, 50], [42, 65], [28, BASELINE], [12, 68], [8, 55], [12, MIDLINE], [45, MIDLINE], [45, BASELINE], [45, 85], [40, DESCENDER], [25, DESCENDER], [10, 90]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: oval, continue down below baseline, curve left.'
            },
            'h': {
                width: 55,
                // ONE stroke: up tall → loop → down → hump → exit
                strokes: [
                    [[0, BASELINE], [5, 50], [10, 25], [15, ASCENDER], [22, 12], [20, 22], [15, MIDLINE], [15, BASELINE], [15, 55], [22, 45], [35, MIDLINE], [48, 42], [52, 55], [52, BASELINE], [55, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up tall with loop, down, hump over, exit.'
            },
            'i': {
                width: 30,
                // TWO strokes: main, then dot
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, BASELINE], [18, 68], [25, 62], [30, 55]],
                    [[12, 28], [13, 30], [12, 28]]
                ],
                strokeNames: ['Main stroke', 'Dot'],
                tip: 'First: up, down with exit. Then: add dot.'
            },
            'j': {
                width: 30,
                // TWO strokes: main with tail, then dot
                strokes: [
                    [[0, BASELINE], [8, 55], [15, MIDLINE], [15, BASELINE], [15, 85], [10, DESCENDER], [0, 92]],
                    [[15, 28], [16, 30], [15, 28]]
                ],
                strokeNames: ['Main stroke', 'Dot'],
                tip: 'First: up, down past baseline, curve. Then: add dot.'
            },
            'k': {
                width: 50,
                // ONE stroke: tall loop → down → kick out (diagonal in connects)
                strokes: [
                    [[0, BASELINE], [5, 50], [10, 25], [15, ASCENDER], [22, 12], [20, 22], [15, MIDLINE], [15, BASELINE], [15, 55], [42, 38], [30, 50], [20, 58], [25, 60], [35, BASELINE], [42, BASELINE], [50, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: tall stroke, down, kick angles, exit.'
            },
            'l': {
                width: 35,
                // ONE stroke: up tall → loop → down → exit
                strokes: [
                    [[0, BASELINE], [5, 50], [12, 25], [18, ASCENDER], [25, 12], [22, 22], [18, MIDLINE], [18, BASELINE], [25, 68], [32, 62], [35, 55]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One elegant motion: up with loop, down, exit right.'
            },
            'm': {
                width: 75,
                // ONE stroke: up → down → hump → hump → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, BASELINE], [12, 55], [20, 42], [32, MIDLINE], [38, 45], [38, BASELINE], [38, 55], [48, 42], [60, MIDLINE], [68, 45], [68, BASELINE], [75, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down, first hump, second hump, exit.'
            },
            'n': {
                width: 50,
                // ONE stroke: up → down → hump → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, BASELINE], [12, 55], [22, 42], [38, MIDLINE], [45, 48], [45, BASELINE], [50, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down, hump over, exit.'
            },
            'o': {
                width: 50,
                // ONE stroke: entry → oval → small exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, 35], [40, 38], [48, 50], [45, 65], [30, BASELINE], [12, 68], [8, 55], [15, MIDLINE], [45, 55], [50, 62]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, complete oval, small connector exit.'
            },
            'p': {
                width: 50,
                // ONE stroke: up → down deep → up → bump → exit
                strokes: [
                    [[0, BASELINE], [8, 55], [15, MIDLINE], [15, BASELINE], [15, 85], [15, DESCENDER], [15, 55], [25, 45], [40, 45], [48, 55], [45, 68], [30, BASELINE], [15, 65], [45, 60], [50, 55]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down past baseline, back up, bump, exit.'
            },
            'q': {
                width: 55,
                // ONE stroke: entry → oval → down → tail right
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, 35], [40, 38], [48, 50], [45, 65], [30, BASELINE], [12, 68], [8, 55], [15, MIDLINE], [48, 50], [48, BASELINE], [48, 88], [52, DESCENDER], [60, DESCENDER+2]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: oval, down past baseline, tail curves right.'
            },
            'r': {
                width: 38,
                // ONE stroke: up → down → shoulder
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, BASELINE], [12, 55], [20, 45], [30, MIDLINE], [38, 48]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down, small shoulder curve.'
            },
            's': {
                width: 40,
                // ONE stroke: snake curve
                strokes: [
                    [[0, BASELINE], [5, 58], [12, 48], [22, MIDLINE], [32, 42], [35, 50], [28, 58], [18, 60], [12, 65], [15, BASELINE], [28, BASELINE], [40, 62]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One snake motion: up, curve back, curve forward, exit.'
            },
            't': {
                width: 38,
                // TWO strokes: main, then cross
                strokes: [
                    [[0, BASELINE], [8, 55], [15, 30], [15, BASELINE], [22, 68], [30, 62], [38, 55]],
                    [[5, 48], [28, 48]]
                ],
                strokeNames: ['Main stroke', 'Cross'],
                tip: 'First: up, down with exit. Then: cross stroke.'
            },
            'u': {
                width: 50,
                // ONE stroke: up → down curve → up → down → exit
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, 60], [18, BASELINE], [30, BASELINE], [40, 60], [42, MIDLINE], [42, BASELINE], [50, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down and curve, up, down with exit.'
            },
            'v': {
                width: 45,
                // ONE stroke: V shape
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [25, BASELINE], [40, MIDLINE], [45, 55]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, diagonal down to point, diagonal up.'
            },
            'w': {
                width: 65,
                // ONE stroke: zigzag
                strokes: [
                    [[0, BASELINE], [5, 55], [10, MIDLINE], [20, BASELINE], [32, MIDLINE+5], [42, BASELINE], [55, MIDLINE], [62, 55], [65, 60]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, down-up-down-up like connected Vs.'
            },
            'x': {
                width: 45,
                // TWO strokes: two diagonals
                strokes: [
                    [[0, BASELINE], [5, 58], [12, 48], [35, BASELINE], [42, 68], [45, 62]],
                    [[40, MIDLINE], [25, 55], [10, BASELINE]]
                ],
                strokeNames: ['First diagonal', 'Cross diagonal'],
                tip: 'Two strokes: first diagonal, then crossing diagonal.'
            },
            'y': {
                width: 50,
                // ONE stroke: u-shape top → down tail
                strokes: [
                    [[0, BASELINE], [5, 55], [12, MIDLINE], [12, 60], [18, BASELINE], [30, BASELINE], [40, 60], [42, MIDLINE], [42, BASELINE], [42, 85], [35, DESCENDER], [20, DESCENDER], [8, 88]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: like u on top, continue down, curve left.'
            },
            'z': {
                width: 42,
                // ONE stroke: up → across → diagonal → across → exit
                strokes: [
                    [[0, BASELINE], [5, 58], [12, 48], [18, MIDLINE], [38, MIDLINE], [10, BASELINE], [42, BASELINE], [48, 65]]
                ],
                strokeNames: ['Complete letter'],
                tip: 'One motion: up, across, diagonal down, across, exit.'
            },
            ' ': {
                width: 25,
                strokes: [],
                strokeNames: [],
                tip: 'Lift pen, move right for space.'
            }
        };

        // State
        let canvas, ctx;
        let currentWord = '', displayWord = '';
        let currentLetterIndex = 0;
        let currentStrokeIndex = 0;
        let isAnimating = false, isPaused = false;
        let animationId = null;
        let allDrawnPoints = [];
        let letterStartPositions = [];

        // Cubic bezier interpolation for smooth curves
        function cubicBezier(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            const mt = 1 - t;
            const mt2 = mt * mt;
            const mt3 = mt2 * mt;
            return {
                x: mt3 * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t3 * p3.x,
                y: mt3 * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t3 * p3.y
            };
        }

        // Generate smooth curve points from control points using Catmull-Rom
        function generateSmoothPath(points, segments = 12) {
            if (points.length < 2) return points.map(p => ({ x: p[0], y: p[1] }));

            const result = [];
            const pts = points.map(p => ({ x: p[0], y: p[1] }));

            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[Math.max(0, i - 1)];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[Math.min(pts.length - 1, i + 2)];

                for (let t = 0; t < 1; t += 1 / segments) {
                    const t2 = t * t;
                    const t3 = t2 * t;

                    const x = 0.5 * ((2 * p1.x) +
                        (-p0.x + p2.x) * t +
                        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);

                    const y = 0.5 * ((2 * p1.y) +
                        (-p0.y + p2.y) * t +
                        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);

                    result.push({ x, y });
                }
            }
            result.push(pts[pts.length - 1]);
            return result;
        }

        function init() {
            canvas = document.getElementById('writingCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            buildLetterGrid();
            updateSpeedLabel();
            startWriting();
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 280;
            drawGuidelines();
            redrawAll();
        }

        function drawGuidelines() {
            const w = canvas.width;
            const h = canvas.height;
            const scale = h / 100;

            ctx.clearRect(0, 0, w, h);

            // Ascender line
            ctx.strokeStyle = '#ffcccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, ASCENDER * scale);
            ctx.lineTo(w, ASCENDER * scale);
            ctx.stroke();

            // x-height / midline (dashed)
            ctx.strokeStyle = '#ff9999';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, MIDLINE * scale);
            ctx.lineTo(w, MIDLINE * scale);
            ctx.stroke();
            ctx.setLineDash([]);

            // Baseline
            ctx.strokeStyle = '#4444ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, BASELINE * scale);
            ctx.lineTo(w, BASELINE * scale);
            ctx.stroke();

            // Descender line
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, DESCENDER * scale);
            ctx.lineTo(w, DESCENDER * scale);
            ctx.stroke();
        }

        function buildLetterGrid() {
            const grid = document.getElementById('letterGrid');
            'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => setWord(letter);
                grid.appendChild(btn);
            });
        }

        function setWord(word) {
            document.getElementById('wordInput').value = word;
            startWriting();
        }

        function startWriting() {
            cancelAnimation();

            currentWord = document.getElementById('wordInput').value.trim().toLowerCase();
            if (!currentWord) return;

            displayWord = currentWord;
            currentLetterIndex = 0;
            currentStrokeIndex = 0;
            isAnimating = true;
            isPaused = false;
            allDrawnPoints = [];
            letterStartPositions = [];
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            // Build progress dots
            const progressRow = document.getElementById('progressRow');
            progressRow.innerHTML = '';
            displayWord.split('').forEach((char, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.textContent = char;
                dot.onclick = () => jumpTo(i);
                progressRow.appendChild(dot);
            });

            // Calculate letter positions
            calculateLetterPositions();

            // Draw ghost outlines and guidelines
            drawGuidelines();
            drawGhostLetters();

            updateProgress();
            showInstruction(0);
            animateStroke();
        }

        function calculateLetterPositions() {
            const scale = canvas.height / 100;
            let xOffset = 30;

            displayWord.split('').forEach((char, index) => {
                const letterData = letterStrokes[char] || letterStrokes['a'];
                letterStartPositions.push(xOffset);
                xOffset += letterData.width * scale * 0.7 + 5;
            });
        }

        function drawGhostLetters() {
            const scale = canvas.height / 100;
            const color = '#e0e0e0';

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            displayWord.split('').forEach((char, index) => {
                const letterData = letterStrokes[char];
                if (!letterData || !letterData.strokes) return;

                const xOffset = letterStartPositions[index];

                letterData.strokes.forEach(stroke => {
                    if (stroke.length < 2) return;

                    const points = generateSmoothPath(stroke, 8);
                    ctx.beginPath();
                    ctx.moveTo(xOffset + points[0].x * scale * 0.7, points[0].y * scale);

                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(xOffset + points[i].x * scale * 0.7, points[i].y * scale);
                    }
                    ctx.stroke();
                });
            });
        }

        function updateProgress() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentLetterIndex) dot.classList.add('done');
                else if (i === currentLetterIndex) dot.classList.add('current');
            });
        }

        function showInstruction(letterIndex) {
            const letterSpan = document.getElementById('currentLetter');
            const textDiv = document.getElementById('instructionText');
            const stepsDiv = document.getElementById('strokeSteps');

            if (letterIndex >= displayWord.length) {
                letterSpan.textContent = '✓';
                textDiv.innerHTML = '<strong>Excellent!</strong> You completed the word!';
                stepsDiv.innerHTML = '';
                return;
            }

            const char = displayWord[letterIndex];
            letterSpan.textContent = char;

            const letterData = letterStrokes[char] || { tip: 'Watch and follow!', strokeNames: [] };
            textDiv.innerHTML = `<strong>Tip:</strong> ${letterData.tip}`;

            // Show stroke steps
            stepsDiv.innerHTML = letterData.strokeNames.map((name, i) =>
                `<div class="stroke-step ${i === currentStrokeIndex ? 'active' : ''}">
                    <span class="step-num">${i + 1}</span>${name}
                </div>`
            ).join('');
        }

        function animateStroke() {
            if (!isAnimating || isPaused) return;

            // Skip spaces
            while (currentLetterIndex < displayWord.length && displayWord[currentLetterIndex] === ' ') {
                currentLetterIndex++;
                currentStrokeIndex = 0;
            }

            if (currentLetterIndex >= displayWord.length) {
                isAnimating = false;
                updateProgress();
                showInstruction(displayWord.length);
                return;
            }

            const char = displayWord[currentLetterIndex];
            const letterData = letterStrokes[char];

            if (!letterData || currentStrokeIndex >= letterData.strokes.length) {
                currentLetterIndex++;
                currentStrokeIndex = 0;
                updateProgress();
                showInstruction(currentLetterIndex);
                setTimeout(() => animateStroke(), 200);
                return;
            }

            const stroke = letterData.strokes[currentStrokeIndex];
            const xOffset = letterStartPositions[currentLetterIndex];
            const scale = canvas.height / 100;

            const color = document.getElementById('colorSelect').value;
            const lineWidth = parseInt(document.getElementById('sizeSelect').value);
            const speed = parseInt(document.getElementById('speedSlider').value);

            // Generate smooth points for this stroke
            const points = generateSmoothPath(stroke, 10);
            const scaledPoints = points.map(p => ({
                x: xOffset + p.x * scale * 0.7,
                y: p.y * scale
            }));

            let currentPointIndex = 0;
            const pointDelay = Math.max(5, (11 - speed) * 8);

            showInstruction(currentLetterIndex);

            function drawNextSegment() {
                if (!isAnimating || isPaused) return;

                if (currentPointIndex >= scaledPoints.length - 1) {
                    // Stroke complete
                    currentStrokeIndex++;

                    if (currentStrokeIndex >= letterData.strokes.length) {
                        // Letter complete
                        currentLetterIndex++;
                        currentStrokeIndex = 0;
                        updateProgress();
                        showInstruction(currentLetterIndex);
                        setTimeout(() => animateStroke(), 250);
                    } else {
                        // Next stroke
                        showInstruction(currentLetterIndex);
                        setTimeout(() => animateStroke(), 150);
                    }
                    return;
                }

                const from = scaledPoints[currentPointIndex];
                const to = scaledPoints[currentPointIndex + 1];

                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(to.x, to.y);
                ctx.stroke();

                allDrawnPoints.push({ from: { ...from }, to: { ...to }, color, lineWidth });

                currentPointIndex++;
                animationId = setTimeout(drawNextSegment, pointDelay);
            }

            drawNextSegment();
        }

        function redrawAll() {
            drawGuidelines();

            if (displayWord) {
                drawGhostLetters();
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (const seg of allDrawnPoints) {
                ctx.strokeStyle = seg.color;
                ctx.lineWidth = seg.lineWidth;
                ctx.beginPath();
                ctx.moveTo(seg.from.x, seg.from.y);
                ctx.lineTo(seg.to.x, seg.to.y);
                ctx.stroke();
            }
        }

        function cancelAnimation() {
            if (animationId) {
                clearTimeout(animationId);
                animationId = null;
            }
            isAnimating = false;
        }

        function togglePause() {
            const btn = document.getElementById('pauseBtn');
            if (isPaused) {
                isPaused = false;
                btn.textContent = '⏸️ Pause';
                animateStroke();
            } else {
                isPaused = true;
                btn.textContent = '▶️ Resume';
            }
        }

        function drawLetterInstantly(letterIndex) {
            const char = displayWord[letterIndex];
            const letterData = letterStrokes[char];
            if (!letterData) return;

            const xOffset = letterStartPositions[letterIndex];
            const scale = canvas.height / 100;
            const color = document.getElementById('colorSelect').value;
            const lineWidth = parseInt(document.getElementById('sizeSelect').value);

            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            letterData.strokes.forEach(stroke => {
                const points = generateSmoothPath(stroke, 10);
                const scaledPoints = points.map(p => ({
                    x: xOffset + p.x * scale * 0.7,
                    y: p.y * scale
                }));

                for (let i = 0; i < scaledPoints.length - 1; i++) {
                    const from = scaledPoints[i];
                    const to = scaledPoints[i + 1];

                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.stroke();

                    allDrawnPoints.push({ from: { ...from }, to: { ...to }, color, lineWidth });
                }
            });
        }

        function rebuildToIndex(targetLetterIndex) {
            allDrawnPoints = [];
            drawGuidelines();
            drawGhostLetters();

            for (let i = 0; i < targetLetterIndex; i++) {
                drawLetterInstantly(i);
            }
        }

        function prevLetter() {
            if (currentLetterIndex > 0) {
                cancelAnimation();
                currentLetterIndex--;
                currentStrokeIndex = 0;
                rebuildToIndex(currentLetterIndex);
                updateProgress();
                showInstruction(currentLetterIndex);
                isAnimating = true;
                isPaused = false;
                animateStroke();
            }
        }

        function nextLetter() {
            if (currentLetterIndex < displayWord.length) {
                cancelAnimation();
                drawLetterInstantly(currentLetterIndex);
                currentLetterIndex++;
                currentStrokeIndex = 0;
                updateProgress();
                showInstruction(currentLetterIndex);

                if (currentLetterIndex < displayWord.length) {
                    isAnimating = true;
                    isPaused = false;
                    animateStroke();
                }
            }
        }

        function jumpTo(index) {
            cancelAnimation();
            rebuildToIndex(index);
            currentLetterIndex = index;
            currentStrokeIndex = 0;
            updateProgress();
            showInstruction(currentLetterIndex);

            if (currentLetterIndex < displayWord.length) {
                isAnimating = true;
                isPaused = false;
                animateStroke();
            }
        }

        function updateSpeedLabel() {
            const val = document.getElementById('speedSlider').value;
            const labels = ['', 'Very Slow', 'Slow', 'Slow', 'Medium-Slow', 'Medium', 'Medium', 'Medium-Fast', 'Fast', 'Fast', 'Very Fast'];
            document.getElementById('speedLabel').textContent = labels[val];
        }

        window.onload = init;
    </script>
</body>
</html>
